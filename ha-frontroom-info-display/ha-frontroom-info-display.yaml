# ============================================================ 
# Hardware related setup
#
# Setup SPI for the display. The ESP32-2432S028R uses separate SPI buses for display and touch
spi:
  - id: tft
    clk_pin: GPIO14
    mosi_pin: GPIO13
    miso_pin: GPIO12
  - id: touch
    clk_pin: GPIO25
    mosi_pin: GPIO32
    miso_pin: GPIO39

# Setup a pin to control the backlight
output:
  - platform: ledc
    pin: GPIO21
    id: backlight_pwm
  - platform: ledc
    pin: GPIO17
    id: led_now
    inverted: true
  - platform: ledc
    pin: GPIO27
    id: led_plan
    inverted: true

# Set up the xpt2046 touch platform
touchscreen:
  platform: xpt2046
  id: my_touchscreen
  spi_id: touch
  cs_pin: GPIO33
  interrupt_pin: GPIO36
  update_interval: 50ms
  threshold: 400
  calibration:
    x_max: ${touch_x_max}
    x_min: ${touch_x_min}
    y_max: ${touch_y_max}
    y_min: ${touch_y_min}
  transform:
    swap_xy: ${touch_swap_xy}
    mirror_x: ${touch_mirror_x}
    mirror_y: ${touch_mirror_y}
  # Gibt bei jeder Beruehrung Bildschirm- und Rohkoordinaten aus. Die
  # Rohwerte sind panelabhaengig und werden beim Nachbau gebraucht, um
  # calibration: zu fuellen - siehe HARDWARE.md, Abschnitt 8. Im Normalbetrieb
  # aus, einzuschalten ueber den Schalter touch_cal_log in Home Assistant.
  on_touch:
    - lambda: |-
        if (id(touch_cal_log).state) {
          ESP_LOGI("cal", "x=%d, y=%d, x_raw=%d, y_raw=%d",
                   touch.x, touch.y, touch.x_raw, touch.y_raw);
        }

# Update the UI state
interval:
  - interval: 1s
    then:
      - lambda: |-
          // Die beiden Tasten-LEDs zeigen, was evcc meldet - nicht, was hier
          // lokal geschaltet wurde. Deshalb wird abgeglichen statt nur auf
          // Zustandswechsel reagiert: eine verpasste Meldung heilt von selbst,
          // und ein lokaler Eingriff kann nicht stehen bleiben.
          bool plan_soll = id(evcc_chargeplan_enabled).state;
          if (id(plan_indicator).remote_values.is_on() != plan_soll) {
            auto c = id(plan_indicator).make_call();
            c.set_state(plan_soll);
            c.perform();
          }
          bool now_soll = id(wallbox_mode).state == "NOW";
          if (id(now_indicator).remote_values.is_on() != now_soll) {
            auto c = id(now_indicator).make_call();
            c.set_state(now_soll);
            c.perform();
          }

          if (id(hint_left) > 0) { id(hint_left)--; }

          // Hat evcc den angenommenen Befehl auch ausgefuehrt? Verglichen wird
          // gegen dieselbe Spiegelung, die auch die LEDs treibt.
          if (id(pend_mode_left) > 0) {
            if (id(wallbox_mode).state == id(pend_mode)) {
              id(pend_mode_left) = 0;
            } else if (--id(pend_mode_left) == 0) {
              id(show_hint)->execute("Mode not confirmed", 1);
            }
          }
          if (id(pend_plan_left) > 0) {
            if (id(evcc_chargeplan_enabled).state == (id(pend_plan) == 1)) {
              id(pend_plan_left) = 0;
            } else if (--id(pend_plan_left) == 0) {
              // Ein gesendeter Plan wird nicht wirksam, wenn der Ziel-SoC
              // schon erreicht ist. Kein Fehler, aber man will es wissen.
              id(show_hint)->execute(id(pend_plan) == 1 ? "Plan sent, not active"
                                                        : "Plan still active", 1);
            }
          }

          if (id(plan_setup_timeout_timer)) {
            id(plan_setup_timeout_timer)--;

            if (id(plan_setup_timeout_timer) == 0) {
              // Gesendet wird nur fuer das bekannte Fahrzeug. Ohne Fahrzeug
              // koennte evcc den Plan nicht zuordnen, bei einem fremden ginge
              // er an ${evcc_vehicle}.
              if (id(vehicle_connected).has_state() && id(vehicle_connected).state &&
                  id(known_vehicle).state) {
                id(send_plan_request).execute();
              } else {
                // Zehn Sekunden eingestellt und dann doch nichts gesendet -
                // das darf nicht wortlos passieren.
                id(hint_no_plan).execute();
              }
              id(main_page).show();
            }
          }
  - interval: ${page_return_timeout}
    then:
      - if:
          condition:
            - lambda: |-
                return !id(recent_touch);
          then: 
            - display.page.show: main_page
          else:
            - lambda: |-
                id(recent_touch) = false;

# Display is used as 240x320 by default so we rotate it to 90°
#
# Bleibt vorerst bei ili9xxx. Der Nachfolger mipi_spi ist auf diesem Board
# gemessen 55 % langsamer: Puffer- und Panelformat weichen ab (8 gegen 16 Bit),
# und die Umwandlung laeuft dort in Haeppchen von 48 Pixeln statt 63. Der
# schnelle Weg waere ein 16-Bit-Puffer mit 153.6 KB - so viel DRAM ist nicht
# frei, und PSRAM hat das Board keinen. ili9xxx faellt erst mit ESPHome 2027.1.
display:
  - platform: ili9xxx
    model: ili9342
    spi_id: tft
    cs_pin: GPIO15
    dc_pin: GPIO2
    color_order: rgb
    invert_colors: false
    id: my_display
    update_interval: 500ms
    color_palette: 8BIT
    pages:
      - id: main_page
        lambda: |-         
          //***********************************
          id(weather_animation).next_frame();
          it.image(0, 5, id(weather_animation), COLOR_ON, COLOR_OFF);
          it.line(0,80,320,80, HA_BLUE);
          it.image(0, 86, id(sun_icon));
          it.image(0, 123, id(plug_icon));
          it.line(160,85,160, 155, HA_BLUE);
          it.line(0,160,320,160, HA_BLUE);
          it.image(0, 165, id(wallbox_icon));
          //***********************************
          it.printf(90,0,id(lato24), WHITE,"%s",id(weather_condition).state.c_str());
          it.image(85, 42, id(thermometer_icon));       
          if (id(outside_temperature).has_state()) {
            it.printf(112,38,id(lato20), WHITE,"%.1f °C", id(outside_temperature).state);
          } else {
            it.printf(112,38,id(lato20), WHITE,"--- °C");
          }
          if (id(raining).has_state()) {
            if (id(raining).state == true) {
              it.image(200, 47,  id(rain_icon));
              it.printf(240, 38, id(lato20), WHITE,"WET");
              if (id(rain_freq).has_state()) {
                it.printf(240, 63, id(lato14), WHITE, "%.0f Hz", id(rain_freq).state);
              }
            } else {
              it.image(200, 47, id(dry_icon));
              it.printf(240,38, id(lato20), WHITE,"DRY");
            }
          } else {
              it.printf(240,38,id(lato20), WHITE,"---");
          }
          //** SOLAR *********************************
          if (id(pv_power).has_state()) {
            it.printf(65, 91, id(lato20), WHITE, "%.0f W", id(pv_power).state);
            if (!id(grid_power).has_state()) {
              it.printf(65, 126, id(lato20), WHITE, "---");
            } else if (id(grid_power).state > 0) {
              it.printf(65, 126, id(lato20), LIGHTGREEN, "%.0f W", id(grid_power).state);
            } else if (id(grid_power).state < 0) {
              it.printf(65, 126, id(lato20), LIGHTRED, "%.0f W", abs(id(grid_power).state));
            } else {
              it.printf(65, 126, id(lato20), WHITE, "%.0f W", id(grid_power).state);
            }
          } else {
            it.printf(85, 113, id(lato14), WHITE, "---");
          }
          //** BATTERY *******************************
          if (id(battery_soc).has_state()) {
              if (id(battery_soc).state >= 80) it.image(170, 85, id(b100_icon));
              else if (id(battery_soc).state >= 60) it.image(170, 85, id(b80_icon));
              else if (id(battery_soc).state >= 40) it.image(170, 85, id(b60_icon));
              else if (id(battery_soc).state >= 20) it.image(170, 85, id(b40_icon));
              else it.image(170, 85, id(b20_icon));
              it.printf(230, 94, id(lato20), WHITE, "%5.0f %%", id(battery_soc).state);
              if (!id(battery_power).has_state()) {
                it.printf(230, 126, id(lato20), WHITE, "  ---");
              } else if (id(battery_power).state > 0) {
                it.printf(230, 126, id(lato20), LIGHTGREEN, "%5.0f W", id(battery_power).state);
              } else if (id(battery_power).state < 0) {
                it.printf(230, 126, id(lato20), LIGHTRED, "%5.0f W", abs(id(battery_power).state));
              } else {
                it.printf(230, 126, id(lato20), WHITE, "%5.0f W", id(battery_power).state);
              }
          } else {
            it.printf(230, 113, id(lato14), WHITE, "---");
          }
          //** EV CHARGER ***************************
          if (id(vehicle_connected).has_state()) {
            if (id(vehicle_connected).state == true) {
              // Wer haengt dran. Der Text wird erst weiter unten gezeichnet:
              // wo ein Fahrzeugsymbol Platz hat, steht er mittig darueber,
              // sonst klein rechts oben in den Streifen.
              const char *fz_text;
              Color fz_farbe = WHITE;
              if (id(plan_check_running).has_state() && id(plan_check_running).state > 0) {
                fz_text = "checking ..."; fz_farbe = GRAY;
              } else if (id(vehicle_detection).state) {
                fz_text = "detecting ..."; fz_farbe = GRAY;
              } else if (id(known_vehicle).state) {
                fz_text = id(vehicle_title).state.c_str();
              } else {
                bool ohne_titel = id(vehicle_title).state.empty() ||
                                  id(vehicle_title).state == "unknown" ||
                                  id(vehicle_title).state == "unavailable";
                fz_text = ohne_titel ? "Guest vehicle" : id(vehicle_title).state.c_str();
                fz_farbe = ORANGE;
              }
              bool fz_gezeichnet = false;
              if (id(vehicle_charging).state == true) {
                it.printf(90, 170, id(lato30), WHITE, "CHARGING");
                if (id(wallbox_charge_power).has_state() && id(vehicle_soc).state > 0 && id(vehicle_range).has_state()) {
                  it.printf(90, 210, id(lato20), WHITE, "%.0f W / %.0f %% (%.0f km)", id(wallbox_charge_power).state, id(vehicle_soc).state, id(vehicle_range).state);
                }
              } else {
          // evcc meldet einen unbekannten Ladestand als 0: der MQTT-Sensor
          // setzt float(0), wenn die Nachricht leer ist. Ein schlafendes Auto
          // liefert deshalb 0 %, und 0 >= 0 hiesse faelschlich "geladen".
                bool soc_bekannt = id(vehicle_soc).has_state() && id(vehicle_soc).state > 0;
                bool ziel_bekannt = id(vehicle_target_soc).has_state() && id(vehicle_target_soc).state > 0;
                if (soc_bekannt && ziel_bekannt && id(vehicle_soc).state >= id(vehicle_target_soc).state) {
                  it.printf(90, 185, id(lato30), WHITE, "DONE  -  %.0f %%", id(vehicle_soc).state);
                } else {
                  if (id(evcc_chargeplan_enabled).state) {
                    it.printf(195, 172, id(lato24), WHITE, BLACK,TextAlign::TOP_CENTER, "READY");
                    if (id(evcc_charge_plan_soc).has_state()) {
                      it.printf(195, 204, id(lato20), WHITE, BLACK,TextAlign::TOP_CENTER, "Charge plan %s %.0f %%", id(evcc_charge_plan_time).state.c_str(), id(evcc_charge_plan_soc).state);
                    }
                  } else {
                    it.printf(160, 180, id(lato30), WHITE, BLACK,TextAlign::TOP_CENTER, "READY");
                    it.image(259, 180, id(ev_icon_big));
                    // Mitte des sichtbaren Symbols: 259 + 7 px Rand bis 308.7,
                    // also 287 - nicht die Mitte des Bildkastens.
                    if (id(known_vehicle).state) {
                      it.printf(287, 161, id(lato14), fz_farbe, BLACK, TextAlign::TOP_CENTER, "%s", fz_text);
                      fz_gezeichnet = true;
                    }
                  }
                }
              }
              if (!fz_gezeichnet) {
                it.printf(318,161,id(lato14), fz_farbe, BLACK, TextAlign::TOP_RIGHT, "%s", fz_text);
              }
            } else {
              it.printf(160,180,id(lato20), WHITE, BLACK,TextAlign::TOP_CENTER, "nothing");
              it.printf(160,202,id(lato20), WHITE, BLACK,TextAlign::TOP_CENTER, "connected");
              it.image(270, 179, id(sun_icon));
              if (id(evcc_charge_30d_solar_percentage).has_state()) {
                it.printf(285,212,id(lato14),WHITE, BLACK,TextAlign::TOP_CENTER, "%.0f%%", id(evcc_charge_30d_solar_percentage).state);
              }
            }   
          } else {
            it.printf(85, 193, id(lato14), WHITE, "---");
          }
          //***********************************

          // **** Hinweisbalken ****
          // Wird zuletzt gezeichnet und deckt ab, was darunter liegt. Er
          // erscheint nur, wenn wirklich etwas zu sagen ist - der Normalfall
          // meldet sich ueber die Tasten-LEDs, nicht hier.
          //
          // Blau heisst abgelehnt, rot heisst fehlgeschlagen. Der Text darf
          // hoechstens rund 23 Zeichen haben: in lato30 misst die laengste
          // Meldung 306 der 320 Pixel.
          if (id(hint_left) > 0) {
            Color hbg = id(hint_level) == 2 ? RED : HA_BLUE;
            it.filled_rectangle(0, 196, 320, 44, hbg);
            it.printf(160, 218, id(lato30), BLACK, hbg, TextAlign::CENTER, "%s", id(hint_text).c_str());
          }
      - id: ev_page
        lambda: |-
          it.image(0, 0, id(ev_icon));
          it.image(280, 0, id(back_icon));
          it.image(280, 189, id(sun_icon));
          if (id(evcc_charge_30d_solar_percentage).has_state()) {
            it.printf(295,222,id(lato14),WHITE, BLACK,TextAlign::TOP_CENTER, "%.0f%%", id(evcc_charge_30d_solar_percentage).state);
          } else {
            it.printf(295,222,id(lato14),WHITE, BLACK,TextAlign::TOP_CENTER, "---");
          }
          if (id(evcc_chargeplan_enabled).state) {
            it.image(10, 180, id(clock_icon));
            it.printf(28,220,id(lato14),WHITE, BLACK,TextAlign::TOP_CENTER, "%s", id(evcc_charge_plan_time).state.c_str());
            if (id(evcc_charge_plan_soc).has_state()) {
              it.printf(20,163,id(lato14),WHITE, BLACK,TextAlign::TOP_CENTER, "%.0f%%", id(evcc_charge_plan_soc).state);
            }
            if (id(vehicle_connected).state && !id(vehicle_charging).state) {
              // Unter den Fahrzeugnamen: weiter unten stiesse die Zeile mit
              // dem SoC-Balken zusammen, der ohne Ladung dort steht.
              it.printf(160,80,id(lato20),WHITE, BLACK,TextAlign::TOP_CENTER, "Plan active");
            }
          }
          if (!id(vehicle_connected).has_state()) {
            // Noch keine Meldung aus HA - weder "verbunden" noch "nichts
            // angeschlossen" waere hier belegt.
            it.printf(160, 120, id(lato30), WHITE, BLACK, TextAlign::TOP_CENTER, "---");
          } else if (id(vehicle_connected).state) {
            if (id(vehicle_charging).state) {
              it.printf(160,0,id(lato30), HA_BLUE, BLACK, TextAlign::TOP_CENTER, "Charging");
            } else {
              // Siehe Uebersichtsseite: 0 heisst "unbekannt", nicht "leer".
              bool soc_bekannt = id(vehicle_soc).has_state() && id(vehicle_soc).state > 0;
              bool ziel_bekannt = id(vehicle_target_soc).has_state() && id(vehicle_target_soc).state > 0;
              if (soc_bekannt && ziel_bekannt && id(vehicle_soc).state >= id(vehicle_target_soc).state) {
                it.printf(160,0,id(lato30), HA_BLUE, BLACK, TextAlign::TOP_CENTER, "Charge done");
              } else {
                it.printf(160,0,id(lato30), HA_BLUE, BLACK, TextAlign::TOP_CENTER, "Charger ready");
              }
            }
            // **** Fahrzeug ****
            // Angezeigt wird, was evcc meldet. Waehrend die Automation prueft
            // oder evcc erkennt, steht das hier statt eines Namens - sonst
            // hiesse ein leerer Titel faelschlich "Gastfahrzeug".
            if (id(plan_check_running).has_state() && id(plan_check_running).state > 0) {
              it.printf(160,44,id(lato24), GRAY, BLACK, TextAlign::TOP_CENTER, "Checking vehicle ...");
            } else if (id(vehicle_detection).state) {
              it.printf(160,44,id(lato24), GRAY, BLACK, TextAlign::TOP_CENTER, "Detecting vehicle ...");
            } else if (id(known_vehicle).state) {
              it.printf(160,44,id(lato24), WHITE, BLACK, TextAlign::TOP_CENTER, "%s", id(vehicle_title).state.c_str());
            } else {
              bool ohne_titel = id(vehicle_title).state.empty() ||
                                id(vehicle_title).state == "unknown" ||
                                id(vehicle_title).state == "unavailable";
              it.printf(160,44,id(lato24), ORANGE, BLACK, TextAlign::TOP_CENTER, "%s",
                        ohne_titel ? "Guest vehicle" : id(vehicle_title).state.c_str());
            }
            // **** SoC ****
            // Der Leistungsbalken erscheint nur beim Laden. Sonst rutscht der
            // SoC-Balken an dessen Platz, damit oben Raum fuer das Fahrzeug
            // bleibt und unten kein Loch steht.
            bool laedt = id(vehicle_charging).state && id(wallbox_charge_power).has_state();
            int soc_y = laedt ? 96 : 140;
            it.printf(2,soc_y - 1,id(lato20), WHITE, BLACK, TextAlign::TOP_LEFT, "SoC");
            it.printf(58,soc_y + 22,id(lato10),WHITE, BLACK,TextAlign::TOP_CENTER, "0%%"); it.printf(296,soc_y + 22,id(lato10),WHITE, BLACK,TextAlign::TOP_CENTER, "100%%");
            float ch = 0;
            if (id(vehicle_soc).has_state() && id(vehicle_soc).state > 0) {
              ch = 2.5 * id(vehicle_soc).state;
              it.filled_rectangle(50,soc_y,ch,20,GREEN); it.filled_rectangle(50+ch,soc_y,250-ch,20,HA_BLUE);
              if (id(vehicle_range).has_state()) {
                it.printf(160,soc_y - 2,id(lato20),WHITE, BLACK,TextAlign::BOTTOM_CENTER, "%.0f %% (%.0f km)", id(vehicle_soc).state, id(vehicle_range).state);
              } else {
                it.printf(160,soc_y - 2,id(lato20),WHITE, BLACK,TextAlign::BOTTOM_CENTER, "%.0f %%", id(vehicle_soc).state);
              }
            } else {
              // Ohne SoC keine Balkenlaenge: filled_rectangle() bekaeme NAN
              // als Breite.
              it.filled_rectangle(50,soc_y,250,20,HA_BLUE);
              it.printf(160,soc_y - 2,id(lato20),WHITE, BLACK,TextAlign::BOTTOM_CENTER, "---");
            }
            // **** Power ****
            if (laedt) {
              it.printf(2,139,id(lato20), WHITE, BLACK, TextAlign::TOP_LEFT, "Pow");
              it.printf(58,161,id(lato10),WHITE, BLACK,TextAlign::TOP_CENTER, "0kW"); it.printf(296,161,id(lato10),WHITE, BLACK,TextAlign::TOP_CENTER, "%.0fkW", ${wallbox_max_power} / 1000.0);
              ch = min(250.0, 250.0 / ${wallbox_max_power} * id(wallbox_charge_power).state);
              it.filled_rectangle(50,140,ch,20,LIGHTRED); it.filled_rectangle(50+ch,140,250-ch,20,HA_BLUE);
              // Kein Ladestrom mehr: evcc kennt kein Feld chargeCurrent,
              // sondern chargeCurrents je Phase. Der HA-Sensor horchte auf ein
              // Thema, das es nie gab, stand dauerhaft auf unknown und schrieb
              // deshalb "nan A" neben die Leistung.
              it.printf(160,138,id(lato20),WHITE, BLACK, TextAlign::BOTTOM_CENTER, "%.0f W", id(wallbox_charge_power).state);
            }
            // **** Mode ****
            if (id(wallbox_mode).state == "OFF") {
              it.filled_rectangle(60,180,56,56,GRAY); it.printf(88,196,id(lato20), WHITE, BLACK, TextAlign::TOP_CENTER, "OFF");
            } else {
              it.rectangle(60,180,56,56,GRAY); it.printf(88,196,id(lato20), GRAY, BLACK, TextAlign::TOP_CENTER, "OFF");
            }
            if (id(wallbox_mode).state == "PV") {
              it.filled_rectangle(132,180,56,56,GRAY); it.printf(160,196,id(lato20), WHITE, BLACK, TextAlign::TOP_CENTER, "PV");
            } else {
              it.rectangle(132,180,56,56,GRAY); it.printf(160,196,id(lato20), GRAY, BLACK, TextAlign::TOP_CENTER, "PV");
            }
            if (id(wallbox_mode).state == "NOW") {
              it.filled_rectangle(204,180,56,56,GRAY); it.printf(232,196,id(lato20), WHITE, BLACK, TextAlign::TOP_CENTER, "NOW");
            } else {
              it.rectangle(204,180,56,56,GRAY); it.printf(232,196,id(lato20), GRAY, BLACK, TextAlign::TOP_CENTER, "NOW");
            }
          } else {
            it.printf(160, 118, id(lato30), WHITE, BLACK, TextAlign::BOTTOM_CENTER, "Nothing");
            it.printf(160, 122, id(lato30), WHITE, BLACK, TextAlign::TOP_CENTER, "connected to wallbox");
          }

          // **** Hinweisbalken **** (siehe main_page)
          if (id(hint_left) > 0) {
            Color hbg = id(hint_level) == 2 ? RED : HA_BLUE;
            it.filled_rectangle(0, 196, 320, 44, hbg);
            it.printf(160, 218, id(lato30), BLACK, hbg, TextAlign::CENTER, "%s", id(hint_text).c_str());
          }
      - id: plan_setup_page
        lambda: |-
          it.image(0, 0, id(clock_icon));
          it.printf(160,0,id(lato30), HA_BLUE, BLACK, TextAlign::TOP_CENTER, "Charge Plan");
          it.printf(70,96,id(lato50), WHITE, BLACK, TextAlign::TOP_CENTER, "%02d", id(plan_time_hour));
          it.printf(110,96,id(lato50), WHITE, BLACK, TextAlign::TOP_CENTER, ":");

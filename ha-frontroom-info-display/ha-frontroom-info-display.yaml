esphome:
  name: ha-frontroom-info-display
  friendly_name: ha-frontroom-info-display
  project:
    name: "tsgwiro1.ha-frontroom-info-display"
    version: "${fw_version}"

esp32:
  board: esp32dev
  framework:
    type: esp-idf
    advanced:
      minimum_chip_revision: "3.1"

# HIER überschreiben wir die Grenzen für den starken ESP32
substitutions:
  fw_version: "1.1.0"
  diag_min_heap_ok: "80000"       # 80kb ist gut für ESP32
  diag_min_heap_critical: "40000" # 40kb ist kritisch

packages:
  my_diagnostics: !include common/diagnostics.yaml

# Enable logging
logger:
  logs:
    component: ERROR

# Enable Home Assistant API
api:
  encryption:
    key: !secret frontroom_api_key

ota:
  platform: esphome
  password: !secret frontroom_ota_key

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: !secret frontroom_fallback_ap_ssid
    password: !secret frontroom_fallback_ap_password

captive_portal:

http_request:
   verify_ssl: false

# ============================================================
# Custom scripts for evcc actions
#
script:
  # Logik: Modus auf NOW setzen
  - id: set_mode_now
    then:
      - http_request.post: http://homeassistant.local:7070/api/loadpoints/1/mode/now

  # Logik: Modus auf PV setzen
  - id: set_mode_pv
    then:
      - http_request.post: http://homeassistant.local:7070/api/loadpoints/1/mode/pv

  # Logik: Planladung senden
  - id: send_plan_request
    then:
      - http_request.send:
          method: POST
          url: !lambda |-
            auto ts_local = id(esptime).now().timestamp;
            auto local_timediff = 60 * 60;
            if (id(esptime).now().is_dst) { local_timediff += 60 * 60; }
            auto today = id(esptime).now().hour * 60 * 60 + id(esptime).now().minute * 60 + id(esptime).now().second;
            auto plan = id(plan_time_hour) * 60 * 60 + id(plan_time_minute) * 60;
            auto day_adjust = 86400;
            if (plan > today) { day_adjust = 0; }
            auto ts = ts_local + day_adjust - today - local_timediff + plan;
            auto t = localtime(&ts);
            char tstr[21];
            strftime(tstr, sizeof(tstr), "%Y-%m-%dT%H:%M:%SZ", t);
            char soc[4];
            snprintf(soc, sizeof(soc), "%d", id(plan_soc));
            return ((std::string) "http://homeassistant.local:7070/api/vehicles/db:1/plan/soc/" + soc + "/" + tstr);

  # Logik: Planladung löschen
  - id: delete_plan_request
    then:
      - http_request.send:
          method: DELETE
          url: http://homeassistant.local:7070/api/vehicles/db:1/plan/soc
          
  # Logik: Modus off setzen
  - id : set_mode_off
    then:
      - http_request.post: http://homeassistant.local:7070/api/loadpoints/1/mode/off
      - light.turn_off: now_indiactor

# ============================================================ 
# Home Assistant related setup
#
globals:
  - id: recent_touch
    type: bool
    restore_value: no
    initial_value: "true"
  - id: touch_lock
    type: bool
    restore_value: no
    initial_value: "false"
  - id: arr_anim
    type: int
    restore_value: no
    initial_value: '0'
  - id: plan_setup_timeout
    type: int
    restore_value: no
    initial_value: '10' 
  - id: plan_setup_timeout_timer
    type: int
    restore_value: no
    initial_value: '0' 
  - id: plan_time_hour
    type: int
    restore_value: yes
    initial_value: '3'
  - id: plan_time_minute
    type: int
    restore_value: yes
    initial_value: '30'
  - id: plan_soc
    type: int
    restore_value: yes
    initial_value: '65'

light:
  - platform: monochromatic
    output: backlight_pwm
    name: "Display Backlight"
    id: backlight
    restore_mode: ALWAYS_ON
  - platform: monochromatic
    name: "Charge Now Indicator"
    output: led_now
    internal: true
    id: now_indiactor
    restore_mode: ALWAYS_OFF
  - platform: monochromatic
    name: "Charge Plan Indicator"
    output: led_plan
    internal: true
    id: plan_indiactor
    restore_mode: ALWAYS_OFF

# Define binary sensors
binary_sensor:
  - platform: homeassistant
    entity_id: binary_sensor.raining
    id: raining
  - platform: homeassistant
    entity_id: binary_sensor.evcc_loadpoint_charging
    id: grigio_charging
  - platform: homeassistant
    entity_id: binary_sensor.evcc_loadpoint_connected
    id: grigio_connected
  - platform: homeassistant
    entity_id: binary_sensor.evcc_chargeplan_enabled
    id: evcc_chargeplan_enabled
    on_state:
      then:
        - if:
            condition:
              - lambda: |-
                  return x;
            then:
              - light.turn_on: plan_indiactor
            else:
              - light.turn_off: plan_indiactor
  - platform: gpio
    pin: GPIO35
    id: button_charge_now
    filters:
      - delayed_on: 10ms
    on_press:
      then:
        - if:
            condition:
              - lambda: |-
                  return id(wallbox_mode).state != "NOW";
            then:   
              - script.execute: set_mode_now
            else:
              - script.execute: set_mode_pv
  - platform: gpio
    id: button_charge_plan
    pin:
      number: GPIO22
      mode:
        input: True
        pullup: True
    filters:
      - delayed_on: 10ms
    on_press:
      then:
        - if:
            condition:
              - binary_sensor.is_on: evcc_chargeplan_enabled
            then:
              - script.execute: delete_plan_request
            else:
              - display.page.show: plan_setup_page
              - lambda: |-
                  id(recent_touch) = true;
                  id(plan_setup_timeout_timer) = id(plan_setup_timeout);

  - platform: touchscreen
    id: button_ev
    x_min: 0
    x_max: 320
    y_min: 160
    y_max: 240
    page_id: main_page
    on_press:
      then:
        - display.page.show: ev_page
        - lambda: |-
            id(recent_touch) = true;
            id(touch_lock) = true;
    on_release: 
      then:
        - lambda: |-
            id(touch_lock) = false;
  - platform: touchscreen
    id: button_bat
    x_min: 160
    x_max: 320
    y_min: 80
    y_max: 160
    page_id: main_page
    on_press:
      - display.page.show: bat_page
      - lambda: |-
          id(recent_touch) = true;
  - platform: touchscreen
    id: button_energy
    x_min: 0
    x_max: 160
    y_min: 80
    y_max: 160
    page_id: main_page
    on_press:
      - display.page.show: energy_page
      - lambda: |-
          id(recent_touch) = true;
  - platform: touchscreen
    id: button_return
    x_min: 280
    x_max: 320
    y_min: 0
    y_max: 40
    on_press:
      - display.page.show: main_page
  - platform: touchscreen
    id: button_ev_off
    x_min: 60
    x_max: 116
    y_min: 180
    y_max: 236
    page_id: ev_page
    on_press:
      then:
        - if:
            condition:
              - lambda: |-
                  return !id(touch_lock);
            then:   
              - script.execute: set_mode_off
              - lambda: |-
                  id(recent_touch) = true;
  - platform: touchscreen
    id: button_ev_pv
    x_min: 132
    x_max: 188
    y_min: 180
    y_max: 236
    page_id: ev_page
    on_press:
      then:
        - if:
            condition:
              - lambda: |-
                  return !id(touch_lock);
            then:   
              - script.execute: set_mode_pv
              - lambda: |-
                  id(recent_touch) = true;
  - platform: touchscreen
    id: button_ev_now
    x_min: 204
    x_max: 260
    y_min: 180
    y_max: 236
    page_id: ev_page
    on_press:
      then:
        - if:
            condition:
              - lambda: |-
                  return !id(touch_lock);
            then:   
              - script.execute: set_mode_now
              - lambda: |-
                  id(recent_touch) = true;
  - platform: touchscreen
    id: button_h_plus
    x_min: 40
    x_max: 100
    y_min: 30
    y_max: 90
    page_id: plan_setup_page
    on_press:
      then:
        - lambda: |-
            id(recent_touch) = true;
            id(plan_setup_timeout_timer) = id(plan_setup_timeout);
            id(plan_time_hour) += 1;
            if (id(plan_time_hour) > 23) {
              id(plan_time_hour) = 0;
            }
        - component.update: my_display
  - platform: touchscreen
    id: button_h_minus
    x_min: 40
    x_max: 100
    y_min: 150
    y_max: 210
    page_id: plan_setup_page
    on_press:
      then:
        - lambda: |-
            id(recent_touch) = true;
            id(plan_setup_timeout_timer) = id(plan_setup_timeout);
            id(plan_time_hour) -= 1;
            if (id(plan_time_hour) < 0) {
              id(plan_time_hour) = 23;
            }
        - component.update: my_display            
  - platform: touchscreen
    id: button_min_plus
    x_min: 120
    x_max: 180
    y_min: 30
    y_max: 90
    page_id: plan_setup_page
    on_press:
      then:
        - lambda: |-
            id(recent_touch) = true;
            id(plan_setup_timeout_timer) = id(plan_setup_timeout);
            id(plan_time_minute) += 10;
            if (id(plan_time_minute) > 59) {
              id(plan_time_minute) = 0;
            }
        - component.update: my_display
  - platform: touchscreen
    id: button_min_minus
    x_min: 120
    x_max: 180
    y_min: 150
    y_max: 210
    page_id: plan_setup_page
    on_press:
      then:
        - lambda: |-
            id(recent_touch) = true;
            id(plan_setup_timeout_timer) = id(plan_setup_timeout);
            id(plan_time_minute) -= 10;
            if (id(plan_time_minute) < 0) {
              id(plan_time_minute) = 50;
            }
        - component.update: my_display
  - platform: touchscreen
    id: button_soc_plus
    x_min: 220
    x_max: 280
    y_min: 30
    y_max: 90
    page_id: plan_setup_page
    on_press:
      then:
        - lambda: |-
            id(recent_touch) = true;
            id(plan_setup_timeout_timer) = id(plan_setup_timeout);
            id(plan_soc) += 5;
            if (id(plan_soc) > 100) {
              id(plan_soc) = 100;
            }
        - component.update: my_display
  - platform: touchscreen
    id: button_soc_minus
    x_min: 220
    x_max: 280
    y_min: 150
    y_max: 210
    page_id: plan_setup_page
    on_press:
      then:
        - lambda: |-
            id(recent_touch) = true;
            id(plan_setup_timeout_timer) = id(plan_setup_timeout);
            id(plan_soc) -= 5;
            if (id(plan_soc) < 0) {
              id(plan_soc) = 0;
            }
        - component.update: my_display

# Define all the numeric sensors used
sensor:
  - platform: adc
    pin: GPIO34
    name: "Room Brightness"
    icon: "mdi:brightness-6"
    update_interval: 2s
    raw: True
    internal: true
    accuracy_decimals: 0
    unit_of_measurement: ""
    entity_category: "diagnostic"
    on_value_range:
      - below: 3900
        then:
          - light.turn_on: 
              id: backlight
              brightness: 100%
      - above: 3950
        then:
          - light.turn_on: 
              id: backlight
              brightness: 50%
  - platform: homeassistant
    entity_id: sensor.input_power
    id: solar_input
  - platform: homeassistant
    entity_id: sensor.grid_active_power
    id: solar_grid_power
  - platform: homeassistant
    entity_id: sensor.battery_state_of_capacity
    id: solar_battery_soc
  - platform: homeassistant
    entity_id: sensor.charge_discharge_power
    id: solar_battery_power
  - platform: homeassistant
    entity_id: sensor.outdoor_temperature
    id: outside_temperature
  - platform: homeassistant
    entity_id: sensor.weather_station_frequency
    id: rain_freq
  - platform: homeassistant
    entity_id: sensor.evcc_vehicle_soc
    id: grigio_soc
  - platform: homeassistant
    entity_id: sensor.evcc_vehicle_range
    id: grigio_range
  - platform: homeassistant
    entity_id: sensor.evcc_charge_power_w
    id: wallbox_charge_power
  - platform: homeassistant
    entity_id: sensor.evcc_charge_current
    id: wallbox_charge_current
  - platform: homeassistant
    entity_id: sensor.home_power
    id: home_power
  - platform: homeassistant
    entity_id: sensor.temperature_living_room
    id: temperature_living_room
  - platform: homeassistant
    entity_id: sensor.humidity_living_room
    id: humidity_living_room
  - platform: homeassistant
    entity_id: sensor.evcc_vehicle_target_soc
    id: grigio_target_soc
  - platform: homeassistant
    entity_id: sensor.evcc_charge_30d_solar_percentage
    id: evcc_charge_30d_solar_percentage
  - platform: homeassistant
    entity_id: sensor.heizstab
    id: heizstab_power
  - platform: homeassistant
    entity_id: sensor.wp_zwe2_controller_output_power
    id: heizstab_power_percent
  - platform: homeassistant
    entity_id: sensor.total_wp
    id: wp_electric_power
  - platform: homeassistant
    entity_id: sensor.wp_warmeleistung
    id: wp_heat_power
  - platform: homeassistant
    entity_id: sensor.evcc_chargeplan_soc
    id: evcc_charge_plan_soc

# Define all the string sensors used
text_sensor:
  - platform: homeassistant
    entity_id: weather.egnach #sensor.openweathermap_condition
    id: weather_condition
    filters:
      - to_upper:
  - platform: homeassistant
    entity_id: select.evcc_mode
    id: wallbox_mode
    filters:
      - to_upper:
    on_value:
      then:
        - lambda: |-
            if (x == "NOW") {
              id(now_indiactor).turn_on().perform();
            } else {
              id(now_indiactor).turn_off().perform();
            }
  - platform: homeassistant
    entity_id: sensor.evcc_chargeplan_time
    id: evcc_charge_plan_time

switch:
# Neuer Schalter für HA: Schnellladen
  - platform: template
    name: "EVCC Schnellladen"
    id: switch_evcc_now
    icon: "mdi:lightning-bolt"
    lambda: |-
      if (id(wallbox_mode).state == "NOW") { return true; } else { return false; }
    turn_on_action:
      - script.execute: set_mode_now
    turn_off_action:
      - script.execute: set_mode_pv

  # Neuer Schalter für HA: Planladung
  - platform: template
    name: "EVCC Planladung"
    id: switch_evcc_plan
    icon: "mdi:battery-clock"
    lambda: |-
      return id(evcc_chargeplan_enabled).state;
    turn_on_action:
      - display.page.show: plan_setup_page
      - lambda: |-
          id(recent_touch) = true;
          id(plan_setup_timeout_timer) = id(plan_setup_timeout);
    turn_off_action:
      - script.execute: delete_plan_request

# Create a time sensor, this will fetch time from Home Assistant
time:
  - platform: homeassistant
    id: esptime



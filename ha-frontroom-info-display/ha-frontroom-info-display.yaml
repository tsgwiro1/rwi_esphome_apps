switch:
  # restore_mode: DISABLED ist wesentlich. Die Vorgabe ALWAYS_OFF laesst
  # TemplateSwitch::setup() den Schalter beim Start auf AUS schreiben, und das
  # fuehrt die turn_off_action aus - hier also set_mode_pv an die Wallbox, bei
  # jedem Neustart. Nur bei DISABLED bleibt setup() untaetig. Der Schalter
  # speichert ohnehin keinen Zustand, er spiegelt ueber sein lambda den von
  # evcc gemeldeten.
  - platform: template
    name: "EVCC Schnellladen"
    id: switch_evcc_now
    icon: "mdi:lightning-bolt"
    restore_mode: DISABLED
    lambda: |-
      if (id(wallbox_mode).state == "NOW") { return true; } else { return false; }
    turn_on_action:
      - script.execute: set_mode_now
    turn_off_action:
      - script.execute: set_mode_pv

  # Neuer Schalter für HA: Planladung
  # DISABLED aus demselben Grund wie oben - sonst ginge beim Start ein
  # delete_plan_request an evcc.
  - platform: template
    name: "EVCC Planladung"
    id: switch_evcc_plan
    icon: "mdi:battery-clock"
    restore_mode: DISABLED
    lambda: |-
      return id(evcc_chargeplan_enabled).state;
    turn_on_action:
      - if:
          condition:
            - lambda: |-
                return id(vehicle_connected).has_state() &&
                       id(vehicle_connected).state &&
                       id(known_vehicle).state;
          then:
            - display.page.show: plan_setup_page
            - lambda: |-
                id(recent_touch) = true;
                id(plan_setup_timeout_timer) = id(plan_setup_timeout);
          else:
            # Der Schalter springt gleich wieder zurueck, weil sein lambda den
            # evcc-Zustand meldet. Ohne Hinweis saehe das nach einem Fehler aus.
            - script.execute: hint_no_plan
    turn_off_action:
      - script.execute: delete_plan_request

  # Schaltet das Kalibrierlog des Touchscreens frei. Nach einem Neustart
  # immer aus, damit im Normalbetrieb nichts mitgeschrieben wird.
  - platform: template
    name: "Touch Kalibrierlog"
    id: touch_cal_log
    icon: "mdi:crosshairs-gps"
    entity_category: config
    optimistic: true
    restore_mode: ALWAYS_OFF


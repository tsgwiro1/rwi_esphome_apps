# Define all the string sensors used
text_sensor:
  # Der zuletzt gezeigte Hinweis. Bleibt stehen, nicht nur die vier Sekunden
  # des Balkens: Wer den Ladeplan-Schalter in Home Assistant umlegt und ihn
  # zurueckspringen sieht, findet hier den Grund.
  - platform: template

# ============================================================
# Konfiguration
#
# Alles, was bei einem Nachbau oder in einer anderen Installation angepasst
# werden muss, steht hier. Weiter unten ist kein Entitaetsname, keine Adresse
# und kein Anlagenwert mehr fest verdrahtet.
#
# Zugangsdaten gehoeren NICHT hierher, sondern nach ~/esphome/secrets.yaml und
# werden per !secret geholt: API-Key, OTA-Passwort und Fallback-AP.
#
substitutions:

# ---- Geraet ------------------------------------------------
  device_name: "ha-frontroom-info-display"
  project_name: "tsgwiro1.ha-frontroom-info-display"
  fw_version: "1.6.0"
  device_timezone: "Europe/Zurich"   # ohne diese Angabe nimmt ESPHome die
                                     # Zeitzone des bauenden Rechners

# ---- evcc: Steuerung ueber REST ----------------------------
  evcc_url: "http://homeassistant.local:7070"
  evcc_loadpoint: "1"
  evcc_vehicle: "db:1"

# ---- Entitaeten: PV-Anlage und Hausbatterie ----------------
  ent_pv_power: sensor.input_power
  ent_grid_power: sensor.grid_active_power
  ent_battery_soc: sensor.battery_state_of_capacity
  ent_battery_power: sensor.charge_discharge_power

# ---- Entitaeten: Waermeerzeugung ---------------------------
  ent_heatpump_power_electric: sensor.total_wp
  ent_heatpump_power_heat: sensor.wp_warmeleistung
  ent_heater_power: sensor.heizstab
  ent_heater_percent: sensor.wp_zwe2_controller_output_power

# ---- Entitaeten: Wetter und Aussenwerte --------------------
  ent_weather: weather.egnach     # alternativ z.B. sensor.openweathermap_condition
  ent_outdoor_temperature: sensor.outdoor_temperature
  ent_rain: binary_sensor.raining
  ent_rain_frequency: sensor.weather_station_frequency

# ---- Entitaeten: evcc, Wallbox und Fahrzeug ----------------
  ent_evcc_mode: select.evcc_mode
  ent_evcc_connected: binary_sensor.evcc_loadpoint_connected
  ent_evcc_charging: binary_sensor.evcc_loadpoint_charging
  ent_evcc_charge_power: sensor.evcc_charge_power_w
  ent_evcc_solar_share_30d: sensor.evcc_charge_30d_solar_percentage
  ent_vehicle_soc: sensor.evcc_vehicle_soc
  ent_vehicle_range: sensor.evcc_vehicle_range
  ent_vehicle_target_soc: sensor.evcc_vehicle_target_soc
  ent_plan_enabled: binary_sensor.evcc_chargeplan_enabled
  ent_plan_soc: sensor.evcc_chargeplan_soc
  ent_plan_time: sensor.evcc_chargeplan_time
  ent_vehicle_name: sensor.evcc_vehicle_name
  ent_vehicle_title: sensor.evcc_vehicle_title
  ent_vehicle_detection: binary_sensor.evcc_vehicle_detection
  ent_plan_automation: automation.set_planned_charge_for_next_day

# ---- Anlage ------------------------------------------------
  wallbox_max_power: "11000"      # W, Skalenende des Leistungsbalkens
  ldr_bright_below: "3900"        # LDR-Rohwert, darunter volle Helligkeit
  ldr_dim_above: "3950"           # LDR-Rohwert, darueber halbe Helligkeit
  touch_x_min: "280"              # Touch-Kalibrierung, siehe HARDWARE.md Abschnitt 8
  touch_x_max: "3860"
  touch_y_min: "340"
  touch_y_max: "3860"
  touch_swap_xy: "true"
  touch_mirror_x: "true"
  touch_mirror_y: "true"

# ---- Verhalten ---------------------------------------------
  plan_default_hour: "3"          # Vorgabewerte der Ladeplan-Seite
  plan_default_minute: "30"
  plan_default_soc: "65"
  plan_send_timeout: "10"         # s ohne Beruehrung, dann wird gesendet
  page_return_timeout: "2min"     # Ruecksprung auf die Uebersicht
  hint_seconds: "4"               # s, so lange steht ein Hinweisbalken
  confirm_seconds: "10"           # s, so lange wird auf evccs Bestaetigung gewartet

# ---- Diagnose-Paket ----------------------------------------
  diag_min_heap_ok: "80000"       # 80 kB ist gut fuer den ESP32
  diag_min_heap_critical: "40000" # 40 kB ist kritisch

# ============================================================
esphome:
  name: ${device_name}
  friendly_name: ${device_name}
  project:
    name: "${project_name}"
    version: "${fw_version}"

esp32:
  board: esp32dev
  framework:
    type: esp-idf
    advanced:
      minimum_chip_revision: "3.1"

packages:
  my_diagnostics: !include common/diagnostics.yaml

# Enable logging
logger:
  logs:
    # Die Komponente meldet bei jedem Abtastvorgang "Touchscreen Update
    # [x_raw, y_raw]" auf DEBUG - bei 50 ms Abtastung rund 20 Zeilen je
    # Sekunde, solange ein Finger aufliegt. Die Rohwerte liefert das
    # on_touch-Lambda sauberer: eine Zeile je Beruehrung, und nur wenn der
    # Schalter touch_cal_log eingeschaltet ist.
    xpt2046: INFO

# Enable Home Assistant API
api:
  encryption:
    key: !secret frontroom_api_key

ota:
  platform: esphome
  password: !secret frontroom_ota_key

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: !secret frontroom_fallback_ap_ssid
    password: !secret frontroom_fallback_ap_password

captive_portal:

web_server:
  port: 80
  ota: false
  version: 3

http_request:
   verify_ssl: false
   # http_request ist synchron: perform() blockiert die Schleife, bis die
   # Antwort da ist. Ein nicht erreichbares evcc friert damit die Anzeige ein -
   # mit der Vorgabe von 4.5 s deutlich zu lange. Zwei Sekunden, weil HA und
   # evcc auf demselben Raspi laufen und unter Last nicht schnell antworten.
   timeout: 2s

# ============================================================
# Custom scripts for evcc actions
#
script:
  # Logik: Modus auf NOW setzen
  - id: set_mode_now
    then:
      - http_request.send:
          method: POST
          url: ${evcc_url}/api/loadpoints/${evcc_loadpoint}/mode/now
          on_response:
            - lambda: 'id(evcc_mode_answer)->execute(response->status_code, "NOW");'
          on_error:
            - script.execute: hint_unreachable

  # Logik: Modus auf PV setzen
  - id: set_mode_pv
    then:
      - http_request.send:
          method: POST
          url: ${evcc_url}/api/loadpoints/${evcc_loadpoint}/mode/pv
          on_response:
            - lambda: 'id(evcc_mode_answer)->execute(response->status_code, "PV");'
          on_error:
            - script.execute: hint_unreachable

  # Logik: Planladung senden
  - id: send_plan_request
    then:
      - http_request.send:
          method: POST
          url: !lambda |-
            // now().timestamp ist die UTC-Epoche, hour/minute/second sind
            // Ortszeit. Die Differenz ist die Epoche der letzten Mitternacht
            // vor Ort - ohne jede Annahme ueber die Zeitzone. Liegt die
            // eingestellte Uhrzeit heute schon hinter uns, gilt sie fuer morgen.
            auto t_now = id(esptime).now();
            int32_t today = t_now.hour * 3600 + t_now.minute * 60 + t_now.second;
            int32_t plan = id(plan_time_hour) * 3600 + id(plan_time_minute) * 60;
            time_t ts = t_now.timestamp - today + plan + (plan > today ? 0 : 86400);
            // Faellt eine Zeitumstellung zwischen diese Mitternacht und die
            // geplante Uhrzeit, liegt das Ergebnis eine Stunde daneben.
            auto check = ESPTime::from_epoch_local(ts);
            int32_t drift = check.hour * 3600 + check.minute * 60 - plan;
            if (drift >= -7200 && drift <= 7200) { ts -= drift; }
            char tstr[21];
            ESPTime::from_epoch_utc(ts).strftime(tstr, sizeof(tstr), "%Y-%m-%dT%H:%M:%SZ");
            char soc[4];
            snprintf(soc, sizeof(soc), "%d", id(plan_soc));
            return ((std::string) "${evcc_url}/api/vehicles/${evcc_vehicle}/plan/soc/" + soc + "/" + tstr);
          on_response:
            - lambda: 'id(evcc_plan_answer)->execute(response->status_code, 1);'
          on_error:
            - script.execute: hint_unreachable

  # Logik: Planladung löschen
  - id: delete_plan_request
    then:
      - http_request.send:
          method: DELETE
          url: ${evcc_url}/api/vehicles/${evcc_vehicle}/plan/soc
          on_response:
            - lambda: 'id(evcc_plan_answer)->execute(response->status_code, 2);'
          on_error:
            - script.execute: hint_unreachable
          
  # Zeigt einen Hinweis auf allen Seiten und schreibt ihn nach Home Assistant.
  # Erfolg wird bewusst nicht gemeldet - dafuer sind die Tasten-LEDs da, die
  # den evcc-Zustand spiegeln. Hier steht nur, was davon abweicht.
  - id: show_hint
    parameters:
      text: string
      level: int
    then:
      - lambda: |-
          id(hint_text) = text;
          id(hint_level) = level;
          id(hint_left) = ${hint_seconds};
          id(last_hint).publish_state(text);

  # Antwort eines evcc-Aufrufs. Ein 2xx heisst nur, dass die Anfrage angekommen
  # ist - ob evcc den Zustand auch aendert, prueft danach der Sekundentakt.
  - id: evcc_mode_answer
    parameters:
      code: int
      want: string
    then:
      - lambda: |-
          ESP_LOGI("evcc", "Modus %s: Antwort %d", want.c_str(), code);
          if (code >= 200 && code < 300) {
            id(pend_mode) = want;
            id(pend_mode_left) = ${confirm_seconds};
          } else {
            id(pend_mode_left) = 0;
            id(hint_http_error)->execute(code);
          }

  # want: 1 = Plan erwartet, 2 = kein Plan erwartet.
  - id: evcc_plan_answer
    parameters:
      code: int
      want: int
    then:
      - lambda: |-
          ESP_LOGI("evcc", "Ladeplan %s: Antwort %d",
                   want == 1 ? "gesetzt" : "geloescht", code);
          if (code >= 200 && code < 300) {
            id(pend_plan) = want;
            id(pend_plan_left) = ${confirm_seconds};
          } else {
            id(pend_plan_left) = 0;
            id(hint_http_error)->execute(code);
          }

  - id: hint_http_error
    parameters:
      code: int
    then:
      - lambda: |-
          char t[24];
          snprintf(t, sizeof(t), "evcc error %d", code);
          id(show_hint)->execute(t, 2);

  # Kein Container zurueck: evcc hat gar nicht geantwortet.
  - id: hint_unreachable
    then:
      - logger.log:
          format: "evcc hat nicht geantwortet"
          level: WARN
      - script.execute:
          id: show_hint
          text: "evcc not reachable"
          level: 2

  # Ein Ladeplan wurde abgelehnt. Der Grund ist einer von zweien, und die
  # Unterscheidung braucht es an drei Stellen - deshalb ein eigenes Skript.
  - id: hint_no_plan
    then:
      - lambda: |-
          bool kein_auto = !id(vehicle_connected).has_state() ||
                           !id(vehicle_connected).state;
          id(show_hint)->execute(kein_auto ? "No vehicle connected"
                                           : "Guest vehicle - no plan", 1);

  # Logik: Modus off setzen
  - id: set_mode_off
    then:
      - http_request.send:
          method: POST
          url: ${evcc_url}/api/loadpoints/${evcc_loadpoint}/mode/off
          on_response:
            - lambda: 'id(evcc_mode_answer)->execute(response->status_code, "OFF");'
          on_error:
            - script.execute: hint_unreachable

# ============================================================ 
# Home Assistant related setup
#
globals:
  - id: recent_touch
    type: bool
    restore_value: no
    initial_value: "true"
  - id: touch_lock
    type: bool
    restore_value: no
    initial_value: "false"
  - id: arr_anim
    type: int
    restore_value: no
    initial_value: '0'
  - id: plan_setup_timeout
    type: int
    restore_value: no
    initial_value: '${plan_send_timeout}'
  - id: plan_setup_timeout_timer
    type: int
    restore_value: no
    initial_value: '0' 
  - id: plan_time_hour
    type: int
    restore_value: yes
    initial_value: '${plan_default_hour}'
  - id: plan_time_minute
    type: int
    restore_value: yes
    initial_value: '${plan_default_minute}'
  - id: plan_soc
    type: int
    restore_value: yes
    initial_value: '${plan_default_soc}'
  # Hinweisbalken: Text, Stufe (1 = orange, 2 = rot) und Restlaufzeit in
  # Sekunden. Gesetzt wird ausschliesslich ueber das Skript show_hint.
  - id: hint_text
    type: std::string
    restore_value: no
  - id: hint_level
    type: int
    restore_value: no
    initial_value: '1'
  - id: hint_left
    type: int
    restore_value: no
    initial_value: '0'
  # Bestaetigung: Ein 2xx sagt nur, dass die Anfrage angekommen ist. Ob evcc
  # den Zustand auch aendert, zeigt erst die Spiegelung. pend_mode haelt den
  # erwarteten Modus, pend_plan 1 = Plan erwartet, 2 = kein Plan erwartet.
  - id: pend_mode
    type: std::string
    restore_value: no
  - id: pend_mode_left
    type: int
    restore_value: no
    initial_value: '0'
  - id: pend_plan
    type: int
    restore_value: no
    initial_value: '0'
  - id: pend_plan_left
    type: int
    restore_value: no
    initial_value: '0'

light:
  - platform: monochromatic
    output: backlight_pwm
    name: "Display Backlight"
    id: backlight
    restore_mode: ALWAYS_ON
  - platform: monochromatic
    name: "Charge Now Indicator"
    output: led_now
    internal: true
    id: now_indicator
    restore_mode: ALWAYS_OFF
  - platform: monochromatic
    name: "Charge Plan Indicator"
    output: led_plan
    internal: true
    id: plan_indicator
    restore_mode: ALWAYS_OFF

# Define binary sensors
binary_sensor:
  - platform: homeassistant
    entity_id: ${ent_rain}
    id: raining
  - platform: homeassistant
    entity_id: ${ent_evcc_charging}
    id: vehicle_charging
  - platform: homeassistant
    entity_id: ${ent_evcc_connected}
    id: vehicle_connected
  - platform: homeassistant
    entity_id: ${ent_plan_enabled}
    id: evcc_chargeplan_enabled
  - platform: homeassistant
    entity_id: ${ent_vehicle_detection}
    id: vehicle_detection
  # Wahr, wenn evcc genau das konfigurierte Fahrzeug meldet. Verglichen wird
  # die ID, nicht der Titel - der ist in evcc frei benannt.
  - platform: template
    id: known_vehicle
    internal: true
    lambda: |-
      return id(vehicle_name).state == "${evcc_vehicle}";
  - platform: gpio
    pin: GPIO35
    id: button_charge_now
    filters:
      - delayed_on: 10ms
    on_press:
      then:
        # Ohne angestecktes Fahrzeug bringt ein Moduswechsel nichts: die
        # Automatisierung "Wallbox: Fahrzeug angesteckt" setzt beim Einstecken
        # als Erstes auf off und ueberschreibt jede Vorwahl. Die Modusfelder
        # auf ev_page lehnen aus demselben Grund schon lange ab.
        - if:
            condition:
              - lambda: |-
                  return id(vehicle_connected).has_state() &&
                         id(vehicle_connected).state;
            then:
              - if:
                  condition:
                    - lambda: |-
                        return id(wallbox_mode).state != "NOW";
                  then:
                    - script.execute: set_mode_now
                  else:
                    - script.execute: set_mode_pv
            else:
              - script.execute:
                  id: show_hint
                  text: "No vehicle connected"
                  level: 1
  - platform: gpio
    id: button_charge_plan
    pin:
      number: GPIO22
      mode:
        input: True
        pullup: True
    filters:
      - delayed_on: 10ms
    on_press:
      then:
        - if:
            condition:
              - binary_sensor.is_on: evcc_chargeplan_enabled
            then:
              - script.execute: delete_plan_request
            else:
              # Loeschen geht immer, Setzen nur fuer das bekannte Fahrzeug:
              # ein Plan ginge sonst an ${evcc_vehicle}, waehrend ein fremdes
              # Auto an der Wallbox haengt.
              - if:
                  condition:
                    - lambda: |-
                        return id(vehicle_connected).has_state() &&
                               id(vehicle_connected).state &&
                               id(known_vehicle).state;
                  then:
                    - display.page.show: plan_setup_page
                    - lambda: |-
                        id(recent_touch) = true;
                        id(plan_setup_timeout_timer) = id(plan_setup_timeout);
                  else:
                    - script.execute: hint_no_plan

  - platform: touchscreen
    id: button_ev
    x_min: 0
    x_max: 320
    y_min: 160
    y_max: 240
    page_id: main_page
    on_press:
      then:
        - display.page.show: ev_page
        - lambda: |-
            id(recent_touch) = true;
            id(touch_lock) = true;
    on_release: 
      then:
        - lambda: |-
            id(touch_lock) = false;
  - platform: touchscreen
    id: button_bat
    x_min: 160
    x_max: 320
    y_min: 80
    y_max: 160
    page_id: main_page
    on_press:
      - display.page.show: bat_page
      - lambda: |-
          id(recent_touch) = true;
  - platform: touchscreen
    id: button_energy
    x_min: 0
    x_max: 160
    y_min: 80
    y_max: 160
    page_id: main_page
    on_press:
      - display.page.show: energy_page
      - lambda: |-
          id(recent_touch) = true;
  - platform: touchscreen
    id: button_return
    x_min: 280
    x_max: 320
    y_min: 0
    y_max: 40
    on_press:
      then:
        # Nur auf den Seiten, die oben rechts auch ein Zurueck-Symbol zeichnen.
        # Ohne die Bedingung liegt die Flaeche unsichtbar auch ueber
        # plan_setup_page: ein Tipper neben dem SoC-Pfeil verliesse die Seite,
        # waehrend plan_setup_timeout_timer weiterlaeuft und den Ladeplan zehn
        # Sekunden spaeter trotzdem abschickt.
        - if:
            condition:
              or:
                - display.is_displaying_page: ev_page
                - display.is_displaying_page: bat_page
                - display.is_displaying_page: energy_page
            then:
              - display.page.show: main_page
  - platform: touchscreen
    id: button_ev_off
    # Die drei Modusfelder werden auf ev_page nur im Zweig "verbunden"
    # gezeichnet. Ohne diese Bedingung bliebe die Flaeche aktiv, waehrend die
    # Seite "Nothing connected to wallbox" zeigt - ein Tipper ins Leere wuerde
    # den evcc-Modus umschalten.
    x_min: 60
    x_max: 116
    y_min: 180
    y_max: 236
    page_id: ev_page
    on_press:
      then:
        # touch_lock faengt die Beruehrung ab, die noch vom Seitenwechsel
        # stammt. Das ist kein abgelehnter Befehl und bleibt deshalb stumm -
        # sonst blinkte bei jedem Wechsel auf diese Seite ein Balken auf.
        - if:
            condition:
              - lambda: 'return !id(touch_lock);'
            then:
              - if:
                  condition:
                    - lambda: |-
                        return id(vehicle_connected).has_state() &&
                               id(vehicle_connected).state;
                  then:
                    - script.execute: set_mode_off
                    - lambda: |-
                        id(recent_touch) = true;
                  else:
                    - script.execute:
                        id: show_hint
                        text: "No vehicle connected"
                        level: 1
  - platform: touchscreen
    id: button_ev_pv
    x_min: 132
    x_max: 188
    y_min: 180
    y_max: 236
    page_id: ev_page
    on_press:
      then:
        - if:
            condition:
              - lambda: 'return !id(touch_lock);'
            then:
              - if:
                  condition:
                    - lambda: |-
                        return id(vehicle_connected).has_state() &&
                               id(vehicle_connected).state;
                  then:
                    - script.execute: set_mode_pv
                    - lambda: |-
                        id(recent_touch) = true;
                  else:
                    - script.execute:
                        id: show_hint
                        text: "No vehicle connected"
                        level: 1
  - platform: touchscreen
    id: button_ev_now
    x_min: 204
    x_max: 260
    y_min: 180
    y_max: 236
    page_id: ev_page
    on_press:
      then:
        - if:
            condition:
              - lambda: 'return !id(touch_lock);'
            then:
              - if:
                  condition:
                    - lambda: |-
                        return id(vehicle_connected).has_state() &&
                               id(vehicle_connected).state;
                  then:
                    - script.execute: set_mode_now
                    - lambda: |-
                        id(recent_touch) = true;
                  else:
                    - script.execute:
                        id: show_hint
                        text: "No vehicle connected"
                        level: 1
  - platform: touchscreen
    id: button_h_plus
    x_min: 40
    x_max: 100
    y_min: 40
    y_max: 100
    page_id: plan_setup_page
    on_press:
      then:
        - lambda: |-
            id(recent_touch) = true;
            id(plan_setup_timeout_timer) = id(plan_setup_timeout);
            id(plan_time_hour) += 1;
            if (id(plan_time_hour) > 23) {
              id(plan_time_hour) = 0;
            }
        - component.update: my_display
  - platform: touchscreen
    id: button_h_minus
    x_min: 40
    x_max: 100
    y_min: 160
    y_max: 220
    page_id: plan_setup_page
    on_press:
      then:
        - lambda: |-
            id(recent_touch) = true;
            id(plan_setup_timeout_timer) = id(plan_setup_timeout);
            id(plan_time_hour) -= 1;
            if (id(plan_time_hour) < 0) {
              id(plan_time_hour) = 23;
            }
        - component.update: my_display            
  - platform: touchscreen
    id: button_min_plus
    x_min: 120
    x_max: 180
    y_min: 40
    y_max: 100
    page_id: plan_setup_page
    on_press:
      then:
        - lambda: |-
            id(recent_touch) = true;
            id(plan_setup_timeout_timer) = id(plan_setup_timeout);
            id(plan_time_minute) += 10;
            if (id(plan_time_minute) > 59) {
              id(plan_time_minute) = 0;
            }
        - component.update: my_display
  - platform: touchscreen
    id: button_min_minus
    x_min: 120
    x_max: 180
    y_min: 160
    y_max: 220
    page_id: plan_setup_page
    on_press:
      then:
        - lambda: |-
            id(recent_touch) = true;
            id(plan_setup_timeout_timer) = id(plan_setup_timeout);
            id(plan_time_minute) -= 10;
            if (id(plan_time_minute) < 0) {
              id(plan_time_minute) = 50;
            }
        - component.update: my_display
  - platform: touchscreen
    id: button_soc_plus
    x_min: 220
    x_max: 280
    y_min: 40
    y_max: 100
    page_id: plan_setup_page
    on_press:
      then:
        - lambda: |-
            id(recent_touch) = true;
            id(plan_setup_timeout_timer) = id(plan_setup_timeout);
            id(plan_soc) += 5;
            if (id(plan_soc) > 100) {
              id(plan_soc) = 100;
            }
        - component.update: my_display
  - platform: touchscreen
    id: button_soc_minus
    x_min: 220
    x_max: 280
    y_min: 160
    y_max: 220
    page_id: plan_setup_page
    on_press:
      then:
        - lambda: |-
            id(recent_touch) = true;
            id(plan_setup_timeout_timer) = id(plan_setup_timeout);
            id(plan_soc) -= 5;
            if (id(plan_soc) < 0) {
              id(plan_soc) = 0;
            }
        - component.update: my_display

# Define all the numeric sensors used
sensor:
  - platform: adc
    pin: GPIO34

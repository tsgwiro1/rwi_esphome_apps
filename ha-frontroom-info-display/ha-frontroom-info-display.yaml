          } else {
            it.printf(223, 72, id(lato24), WHITE, "%.0f W", id(battery_power).state);
          }
          it.graph(10, 130, id(home_bat_graph));

          // **** Hinweisbalken **** (siehe main_page)
          if (id(hint_left) > 0) {
            Color hbg = id(hint_level) == 2 ? RED : HA_BLUE;
            it.filled_rectangle(0, 196, 320, 44, hbg);
            it.printf(160, 218, id(lato30), BLACK, hbg, TextAlign::CENTER, "%s", id(hint_text).c_str());
          }
      - id: energy_page
        lambda: |-
          it.image(0, 0, id(energy_icon));
          it.image(280, 0, id(back_icon));
          it.printf(160,0,id(lato30), HA_BLUE, BLACK, TextAlign::TOP_CENTER, "Energy");
          // **** Electrical Power ****
          // Ein HA-Sensor ohne Zustand steht auf NAN. Durch die Bilanz
          // rechnet sich das von selbst weiter, num() schreibt am Ende
          // "---" statt "nan". Bei Netz und Batterie geht das nicht:
          // min()/max() liefern gegen NAN die 0 zurueck und machen aus dem
          // fehlenden Wert stillschweigend eine Null.
          bool ok_grid = id(grid_power).has_state();
          bool ok_bat = id(battery_power).has_state();
          auto num = [&](int x, int y, Color col, TextAlign align, float v, const char *unit) {
            if (std::isnan(v)) {
              it.printf(x, y, id(lato14), col, BLACK, align, "---");
            } else {
              it.printf(x, y, id(lato14), col, BLACK, align, "%.0f %s", v, unit);
            }
          };
          auto p_I_Solar = id(pv_power).state;
          auto p_I_Bat = abs(min((float)0.0, id(battery_power).state));
          auto p_I_Grid = abs(min((float)0.0, id(grid_power).state));
          auto p_I_Total = p_I_Solar + p_I_Grid + p_I_Bat;
          auto p_O_Grid = max((float)0.0, id(grid_power).state);
          auto p_O_Bat = max((float)0.0, id(battery_power).state);
          auto p_O_EV = id(wallbox_charge_power).state;
          auto p_O_Heater = id(heater_power).state;
          auto p_O_WP = id(heatpump_power_electric).state;
          auto p_O_House = (ok_grid && ok_bat)
              ? p_I_Total - p_O_Grid - p_O_Bat - p_O_EV - p_O_Heater - p_O_WP
              : (float) NAN;
          // **** Aux Power and Values ****
          auto p_WP_Heat = id(heatpump_power_heat).state;
          auto p_percent_heater = id(heater_percent).state;
          auto soc_Battery = id(battery_soc).state;
          auto soc_vehicle = id(vehicle_soc).state;
          // **** Energy Flow ****
          if (id(arr_anim) > 5) {
            id(arr_anim) = 0;
          }
          // ** Energy flow to commen consumers **
          it.image(105 + id(arr_anim) * 4,130, id(arrow_r_icon));
          it.image(129 + id(arr_anim) * 4,130, id(arrow_r_icon));
          it.image(153 + id(arr_anim) * 4,130, id(arrow_r_icon));
          it.image(177 + id(arr_anim) * 4,130, id(arrow_r_icon));
          // ** Energy flow to / from grid **
          if (id(grid_power).state > 0) {
            if (id(arr_anim) < 3) it.image(46 - id(arr_anim) * 4,130, id(arrow_l_icon));  // ** push energy to the grid **
            it.image(70 - id(arr_anim) * 4,130, id(arrow_l_icon));  // ** push energy to the grid **
            it.image(94 - id(arr_anim) * 4,130, id(arrow_l_icon));  // ** push energy to the grid **
          } else if (id(grid_power).state < 0) {
            if (id(arr_anim) > 3) it.image(22 + id(arr_anim) * 4,130, id(arrow_r_icon));  // ** get energy from grid **
            it.image(46 + id(arr_anim) * 4,130, id(arrow_r_icon));  // ** get energy from grid **
            it.image(70 + id(arr_anim) * 4,130, id(arrow_r_icon));  // ** get energy from grid **
            if (id(arr_anim) < 3) it.image(94 + id(arr_anim) * 4,130, id(arrow_r_icon));  // ** get energy from grid **
          }
          // ** Energy flow from solar **
          if (id(pv_power).state > 0) {
            if (id(arr_anim) > 0) it.image(103,76 + id(arr_anim) * 4, id(arrow_d_icon));
            it.image(103,100 + id(arr_anim) * 4, id(arrow_d_icon));
            if (id(arr_anim) < 2) it.image(103,124 + id(arr_anim) * 4, id(arrow_d_icon));
          }
          // ** Energy flow to / from battery **
          if (id(battery_power).state > 0) {
            if (id(arr_anim) > 3) it.image(103,117 + id(arr_anim) * 4, id(arrow_d_icon)); // ** charge battery **
            it.image(103,141 + id(arr_anim) * 4, id(arrow_d_icon)); // ** charge battery **
            it.image(103,165 + id(arr_anim) * 4, id(arrow_d_icon)); // ** charge battery **
          } else if (id(battery_power).state < 0) {
            if (id(arr_anim) < 3) it.image(103,141 - id(arr_anim) * 4, id(arrow_u_icon)); // ** discharge battery **
            it.image(103,165 - id(arr_anim) * 4, id(arrow_u_icon)); // ** discharge battery **
            if (id(arr_anim) > 0) it.image(103,189 - id(arr_anim) * 4, id(arrow_u_icon)); // ** discharge battery **
          }
          it.image(101,128, id(valve_icon));
          it.image(193,128, id(valve_icon));
          id(arr_anim) += 1;
          // **** Energy Distribution ****
          auto c = WHITE;
          it.image(10,115, id(powerline_icon));
          c = !ok_grid ? WHITE : (id(grid_power).state > 0 ? LIGHTGREEN : LIGHTRED);
          num(33, 164, c, TextAlign::TOP_CENTER, ok_grid ? p_I_Grid + p_O_Grid : (float) NAN, "W");
          it.image(92,50, id(solarpanel_icon));
          if (p_I_Solar > 0) it.printf(85,65,id(lato14), WHITE, BLACK, TextAlign::TOP_RIGHT, "%.0f W", p_I_Solar);
          it.image(190,65, id(wallbox_small_icon));
          if (soc_vehicle > 0) it.printf(210,63,id(lato14), WHITE, BLACK, TextAlign::BOTTOM_CENTER, "%.0f %%", soc_vehicle);
          if (p_O_EV > 0) it.printf(210,107,id(lato14), WHITE, BLACK, TextAlign::TOP_CENTER, "%.0f W", p_O_EV);
          it.image(265,85, id(airconditioning_icon));
          num(285, 83, YELLOW, TextAlign::BOTTOM_CENTER, p_WP_Heat, "W");
          num(285, 127, WHITE, TextAlign::TOP_CENTER, p_O_WP, "W");
          it.image(265,157, id(house_icon));
          num(285, 199, WHITE, TextAlign::TOP_CENTER, p_O_House, "W");
          it.image(186,174, id(waterheater_icon));
          num(206, 173, WHITE, TextAlign::BOTTOM_CENTER, p_percent_heater, "%");
          num(206, 214, WHITE, TextAlign::TOP_CENTER, p_O_Heater, "W");
          // x=98 statt 90: rueckt den Pol der Batterie auf x 113 und damit unter
          // die Pfeilspalte. Der Ladeblitz rechts im Symbol verschiebt dessen
          // optische Mitte nach rechts, der Pol sitzt entsprechend links davon.
          it.image(98,189, id(batteryhor_icon));
          num(85, 190, WHITE, TextAlign::TOP_RIGHT, soc_Battery, "%");
          c = id(battery_power).state > 0 ? LIGHTGREEN : LIGHTRED;
          if (ok_bat && p_I_Bat + p_O_Bat > 0) it.printf(85,210,id(lato14), c, BLACK, TextAlign::TOP_RIGHT, "%.0f W", p_I_Bat + p_O_Bat);


          // **** Hinweisbalken **** (siehe main_page)
          if (id(hint_left) > 0) {
            Color hbg = id(hint_level) == 2 ? RED : HA_BLUE;
            it.filled_rectangle(0, 196, 320, 44, hbg);
            it.printf(160, 218, id(lato30), BLACK, hbg, TextAlign::CENTER, "%s", id(hint_text).c_str());
          }
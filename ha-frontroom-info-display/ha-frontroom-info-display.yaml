          id(button_min_minus).state ? it.image(120, 160, id(button_arrow_down_pressed)) : it.image(120, 160, id(button_arrow_down)); 
          id(button_soc_minus).state ? it.image(220, 160, id(button_arrow_down_pressed)) : it.image(220, 160, id(button_arrow_down)); 

          // **** Hinweisbalken **** (siehe main_page)
          if (id(hint_left) > 0) {
            Color hbg = id(hint_level) == 2 ? RED : HA_BLUE;
            it.filled_rectangle(0, 196, 320, 44, hbg);
            it.printf(160, 218, id(lato30), BLACK, hbg, TextAlign::CENTER, "%s", id(hint_text).c_str());
          }
      - id: bat_page
        lambda: |-
          auto ok = [](sensor::Sensor *s) { return s->has_state() && !std::isnan(s->state); };
          it.image(0, 0, id(energy_icon));
          it.image(280, 0, id(back_icon));
          it.image(20, 70, id(batt_icon));
          it.printf(160,0,id(lato30), HA_BLUE, BLACK, TextAlign::TOP_CENTER, "Home Battery");
          if (ok(id(battery_soc))) {
            it.printf(80,72,id(lato24), WHITE, BLACK, TextAlign::TOP_LEFT, "%5.0f %%", id(battery_soc).state);
          } else {
            it.printf(80,72,id(lato24), WHITE, BLACK, TextAlign::TOP_LEFT, "  ---");
          }
          it.image(170, 70, id(elect_icon));
          if (!ok(id(battery_power))) {
            it.printf(223, 72, id(lato24), WHITE, "---");
          } else if (id(battery_power).state > 0) {
            it.printf(223, 72, id(lato24), LIGHTGREEN, "%.0f W", id(battery_power).state);
          } else if (id(battery_power).state < 0) {
            it.printf(223, 72, id(lato24), LIGHTRED, "%.0f W", abs(id(battery_power).state));
          } else {
            it.printf(223, 72, id(lato24), WHITE, "%.0f W", id(battery_power).state);
          }
          it.graph(10, 130, id(home_bat_graph));

          // **** Hinweisbalken **** (siehe main_page)
          if (id(hint_left) > 0) {
            Color hbg = id(hint_level) == 2 ? RED : HA_BLUE;
            it.filled_rectangle(0, 196, 320, 44, hbg);
            it.printf(160, 218, id(lato30), BLACK, hbg, TextAlign::CENTER, "%s", id(hint_text).c_str());
          }
      - id: energy_page
        lambda: |-
          auto ok = [](sensor::Sensor *s) { return s->has_state() && !std::isnan(s->state); };
          it.image(0, 0, id(energy_icon));
          it.image(280, 0, id(back_icon));
          it.printf(160,0,id(lato30), HA_BLUE, BLACK, TextAlign::TOP_CENTER, "Energy");
          // **** Electrical Power ****
          // Ein HA-Sensor ohne Zustand steht auf NAN, ebenso einer, den Home
          // Assistant als "unknown" meldet. Durch die Bilanz
          // rechnet sich das von selbst weiter, num() schreibt am Ende
          // "---" statt "nan". Bei Netz und Batterie geht das nicht:
          // min()/max() liefern gegen NAN die 0 zurueck und machen aus dem
          // fehlenden Wert stillschweigend eine Null.
          bool ok_grid = ok(id(grid_power));
          bool ok_bat = ok(id(battery_power));
          auto num = [&](int x, int y, Color col, TextAlign align, float v, const char *unit) {
            if (std::isnan(v)) {
              it.printf(x, y, id(lato14), col, BLACK, align, "---");
            } else {
              it.printf(x, y, id(lato14), col, BLACK, align, "%.0f %s", v, unit);
            }
          };
          auto p_I_Solar = id(pv_power).state;
          auto p_I_Bat = abs(min((float)0.0, id(battery_power).state));
          auto p_I_Grid = abs(min((float)0.0, id(grid_power).state));
          auto p_I_Total = p_I_Solar + p_I_Grid + p_I_Bat;
          auto p_O_Grid = max((float)0.0, id(grid_power).state);
          auto p_O_Bat = max((float)0.0, id(battery_power).state);
          auto p_O_EV = id(wallbox_charge_power).state;
          auto p_O_Heater = id(heater_power).state;
          auto p_O_WP = id(heatpump_power_electric).state;
          auto p_O_House = (ok_grid && ok_bat)
              ? p_I_Total - p_O_Grid - p_O_Bat - p_O_EV - p_O_Heater - p_O_WP
              : (float) NAN;
          // **** Aux Power and Values ****
          auto p_WP_Heat = id(heatpump_power_heat).state;
          auto p_percent_heater = id(heater_percent).state;
          auto soc_Battery = id(battery_soc).state;
          auto soc_vehicle = id(vehicle_soc).state;
          // **** Energy Flow ****
          if (id(arr_anim) > 5) {
            id(arr_anim) = 0;
          }
          // ** Energy flow to commen consumers **
          it.image(105 + id(arr_anim) * 4,130, id(arrow_r_icon));
          it.image(129 + id(arr_anim) * 4,130, id(arrow_r_icon));
          it.image(153 + id(arr_anim) * 4,130, id(arrow_r_icon));
          it.image(177 + id(arr_anim) * 4,130, id(arrow_r_icon));
          // ** Energy flow to / from grid **
          if (id(grid_power).state > 0) {
            if (id(arr_anim) < 3) it.image(46 - id(arr_anim) * 4,130, id(arrow_l_icon));  // ** push energy to the grid **
            it.image(70 - id(arr_anim) * 4,130, id(arrow_l_icon));  // ** push energy to the grid **
            it.image(94 - id(arr_anim) * 4,130, id(arrow_l_icon));  // ** push energy to the grid **
          } else if (id(grid_power).state < 0) {
            if (id(arr_anim) > 3) it.image(22 + id(arr_anim) * 4,130, id(arrow_r_icon));  // ** get energy from grid **
            it.image(46 + id(arr_anim) * 4,130, id(arrow_r_icon));  // ** get energy from grid **
            it.image(70 + id(arr_anim) * 4,130, id(arrow_r_icon));  // ** get energy from grid **
            if (id(arr_anim) < 3) it.image(94 + id(arr_anim) * 4,130, id(arrow_r_icon));  // ** get energy from grid **
          }
          // ** Energy flow from solar **
          if (id(pv_power).state > 0) {
            if (id(arr_anim) > 0) it.image(103,76 + id(arr_anim) * 4, id(arrow_d_icon));
            it.image(103,100 + id(arr_anim) * 4, id(arrow_d_icon));
            if (id(arr_anim) < 2) it.image(103,124 + id(arr_anim) * 4, id(arrow_d_icon));
          }
          // ** Energy flow to / from battery **
          if (id(battery_power).state > 0) {
            if (id(arr_anim) > 3) it.image(103,117 + id(arr_anim) * 4, id(arrow_d_icon)); // ** charge battery **
            it.image(103,141 + id(arr_anim) * 4, id(arrow_d_icon)); // ** charge battery **
            it.image(103,165 + id(arr_anim) * 4, id(arrow_d_icon)); // ** charge battery **
          } else if (id(battery_power).state < 0) {
            if (id(arr_anim) < 3) it.image(103,141 - id(arr_anim) * 4, id(arrow_u_icon)); // ** discharge battery **
            it.image(103,165 - id(arr_anim) * 4, id(arrow_u_icon)); // ** discharge battery **
            if (id(arr_anim) > 0) it.image(103,189 - id(arr_anim) * 4, id(arrow_u_icon)); // ** discharge battery **
          }
          it.image(101,128, id(valve_icon));
          it.image(193,128, id(valve_icon));
          id(arr_anim) += 1;
          // **** Energy Distribution ****
          auto c = WHITE;
          it.image(10,115, id(powerline_icon));
          c = !ok_grid ? WHITE : (id(grid_power).state > 0 ? LIGHTGREEN : LIGHTRED);
          num(33, 164, c, TextAlign::TOP_CENTER, ok_grid ? p_I_Grid + p_O_Grid : (float) NAN, "W");
          it.image(92,50, id(solarpanel_icon));
          if (p_I_Solar > 0) it.printf(85,65,id(lato14), WHITE, BLACK, TextAlign::TOP_RIGHT, "%.0f W", p_I_Solar);
          it.image(190,65, id(wallbox_small_icon));
          if (soc_vehicle > 0) it.printf(210,63,id(lato14), WHITE, BLACK, TextAlign::BOTTOM_CENTER, "%.0f %%", soc_vehicle);
          if (p_O_EV > 0) it.printf(210,107,id(lato14), WHITE, BLACK, TextAlign::TOP_CENTER, "%.0f W", p_O_EV);
          it.image(265,85, id(airconditioning_icon));
          num(285, 83, YELLOW, TextAlign::BOTTOM_CENTER, p_WP_Heat, "W");
          num(285, 127, WHITE, TextAlign::TOP_CENTER, p_O_WP, "W");
          it.image(265,157, id(house_icon));
          num(285, 199, WHITE, TextAlign::TOP_CENTER, p_O_House, "W");
          it.image(186,174, id(waterheater_icon));
          num(206, 173, WHITE, TextAlign::BOTTOM_CENTER, p_percent_heater, "%");
          num(206, 214, WHITE, TextAlign::TOP_CENTER, p_O_Heater, "W");
          // x=98 statt 90: rueckt den Pol der Batterie auf x 113 und damit unter
          // die Pfeilspalte. Der Ladeblitz rechts im Symbol verschiebt dessen
          // optische Mitte nach rechts, der Pol sitzt entsprechend links davon.
          it.image(98,189, id(batteryhor_icon));
          num(85, 190, WHITE, TextAlign::TOP_RIGHT, soc_Battery, "%");
          c = id(battery_power).state > 0 ? LIGHTGREEN : LIGHTRED;
          if (ok_bat && p_I_Bat + p_O_Bat > 0) it.printf(85,210,id(lato14), c, BLACK, TextAlign::TOP_RIGHT, "%.0f W", p_I_Bat + p_O_Bat);


          // **** Hinweisbalken **** (siehe main_page)
          if (id(hint_left) > 0) {
            Color hbg = id(hint_level) == 2 ? RED : HA_BLUE;
            it.filled_rectangle(0, 196, 320, 44, hbg);
            it.printf(160, 218, id(lato30), BLACK, hbg, TextAlign::CENTER, "%s", id(hint_text).c_str());
          }

      - id: weather_page
        lambda: |-
          auto txt = [](text_sensor::TextSensor *s) {
            return s->has_state() && !s->state.empty() &&
                   s->state != "unknown" && s->state != "unavailable";
          };
          // Zu jeder Wetterlage ein Glyph aus dem MDI-Satz. Eine unbekannte
          // Lage bekommt das Ausrufezeichen - eine leere Spalte saehe aus wie
          // ein Fehler der Anzeige, und genau das soll sie nicht.
          auto icon_of = [](const std::string &c) -> const char * {
            if (c == "sunny")            return "\U000F0599";
            if (c == "clear-night")      return "\U000F0594";
            if (c == "partlycloudy")     return "\U000F0595";
            if (c == "cloudy")           return "\U000F0590";
            if (c == "fog")              return "\U000F0591";
            if (c == "rainy")            return "\U000F0597";
            if (c == "pouring")          return "\U000F0596";
            if (c == "snowy")            return "\U000F0598";
            if (c == "snowy-rainy")      return "\U000F067F";
            if (c == "hail")             return "\U000F0592";
            if (c == "lightning")        return "\U000F0593";
            if (c == "lightning-rainy")  return "\U000F067E";
            if (c == "windy")            return "\U000F059D";
            if (c == "windy-variant")    return "\U000F059E";
            return "\U000F05D6";
          };
          // Ein Glyph traegt genau eine Farbe. Deshalb faerbt hier die Lage
          // das ganze Symbol - aus zwei Metern trennt das die Faelle besser
          // als die Binnenzeichnung eines 32-px-Bildes.
          auto color_of = [&](const std::string &c) -> Color {
            if (c == "sunny" || c == "lightning" || c == "lightning-rainy") return YELLOW;
            if (c == "clear-night" || c == "rainy" || c == "pouring" ||
                c == "hail" || c == "snowy-rainy")                          return HA_BLUE;
            if (c == "cloudy" || c == "fog" || c == "windy" ||
                c == "windy-variant")                                       return LIGHTGRAY;
            if (c == "partlycloudy" || c == "snowy")                        return WHITE;
            return ORANGE;
          };
          // Trennzeichen ist ";", nicht ",". Eine kommagetrennte Zahlenreihe
          // erkennt die Vorlagen-Auswertung von Home Assistant als Tupel und
          // liefert sie als Liste aus - hier kaeme dann "[21, 20.1, ...]" an.
          auto split = [](const std::string &s, char sep, std::string *out, int max) -> int {
            int n = 0;
            size_t p = 0;
            while (n < max) {
              size_t q = s.find(sep, p);
              out[n++] = s.substr(p, q == std::string::npos ? std::string::npos : q - p);
              if (q == std::string::npos) break;
              p = q + 1;
            }
            return n;
          };
          //** Kopf ***********************************
          if (txt(id(weather_condition))) {
            // weather_condition laeuft durch to_upper, die Vorhersage nicht.
            std::string c = id(weather_condition).state;
            for (auto &ch : c) if (ch >= 'A' && ch <= 'Z') ch += 32;
            it.printf(20, 2, id(mdi32), color_of(c), TextAlign::TOP_CENTER, "%s", icon_of(c));
          }
          it.image(280, 0, id(back_icon));
          it.printf(160, 0, id(lato30), HA_BLUE, BLACK, TextAlign::TOP_CENTER, "Forecast");
          it.line(0, 42, 320, 42, HA_BLUE);
          //** Fuenf Tage *****************************
          std::string tag[5];
          int nd = txt(id(forecast_days)) ? split(id(forecast_days).state, ';', tag, 5) : 0;
          for (int i = 0; i < nd; i++) {
            std::string f[5];
            if (split(tag[i], '|', f, 5) < 5) continue;
            int cx = 32 + i * 64;
            if (i) it.line(i * 64, 46, i * 64, 144, GRAY);
            it.printf(cx, 44, id(lato14), HA_BLUE, TextAlign::TOP_CENTER, "%s", f[0].c_str());
            it.printf(cx, 60, id(mdi32), color_of(f[1]), TextAlign::TOP_CENTER, "%s", icon_of(f[1]));
            it.printf(cx, 96, id(lato20), WHITE, TextAlign::TOP_CENTER, "%s°", f[2].c_str());
            it.printf(cx, 118, id(lato14), LIGHTGRAY, TextAlign::TOP_CENTER, "%s°", f[3].c_str());
            // Ein trockener Tag bleibt leer. "0.0 mm" waere eine Tabellenzeile
            // statt einer Anzeige, und unter einem halben Millimeter merkt es
            // ohnehin niemand.
            float r = strtof(f[4].c_str(), nullptr);
            if (r >= 0.5f) it.printf(cx, 134, id(lato10), HA_BLUE, TextAlign::TOP_CENTER, "%.1f mm", r);
          }
          if (nd == 0) it.printf(160, 88, id(lato24), LIGHTGRAY, TextAlign::TOP_CENTER, "No forecast data");
          it.line(0, 148, 320, 148, HA_BLUE);
          //** Stundenkurve, 48 h *********************
          std::string hs[48], hr[48];
          int nh = txt(id(forecast_hours)) ? split(id(forecast_hours).state, ';', hs, 48) : 0;
          int nr = txt(id(forecast_rain))  ? split(id(forecast_rain).state,  ';', hr, 48) : 0;
          if (nh >= 2) {
            const int X0 = 28, X1 = 314, Y0 = 158, Y1 = 234, RH = 34;
            float t[48], lo = 1000.0f, hi = -1000.0f;
            for (int i = 0; i < nh; i++) {
              t[i] = strtof(hs[i].c_str(), nullptr);
              if (t[i] < lo) lo = t[i];
              if (t[i] > hi) hi = t[i];
            }
            // Ein flacher Tag darf die Kurve nicht zum Rauschen aufblasen.
            if (hi - lo < 4.0f) hi = lo + 4.0f;
            auto px = [&](int i) { return X0 + i * (X1 - X0) / (nh - 1); };
            auto py = [&](float v) { return (int) (Y1 - (v - lo) * (Y1 - Y0) / (hi - lo)); };
            int h0 = id(forecast_hstart).has_state() && !std::isnan(id(forecast_hstart).state)
                       ? (int) id(forecast_hstart).state : -1;
            if (h0 >= 0) {
              for (int i = 0; i < nh; i++)
                if ((h0 + i) % 24 == 0) it.line(px(i), Y0 - 6, px(i), Y1 + 2, GRAY);
            }
            // Zwei Millimeter sind das Minimum der Regenskala. Ohne diese
            // Untergrenze stuende ein Nieselregen so hoch wie ein Gewitter.
            float rmax = 2.0f;
            for (int i = 0; i < nr; i++) {
              float r = strtof(hr[i].c_str(), nullptr);
              if (r > rmax) rmax = r;
            }
            for (int i = 0; i < nr && i < nh; i++) {
              float r = strtof(hr[i].c_str(), nullptr);
              if (r > 0) {
                int h = (int) (r / rmax * RH) + 1;
                it.filled_rectangle(px(i) - 2, Y1 - h, 5, h, RAINBLUE);
              }
            }
            // Zweimal gezeichnet: it.line() kennt keine Strichstaerke, und ein
            // einzelnes Pixel verliert sich aus zwei Metern.
            for (int i = 1; i < nh; i++) {
              it.line(px(i - 1), py(t[i - 1]), px(i), py(t[i]), ORANGE);
              it.line(px(i - 1), py(t[i - 1]) - 1, px(i), py(t[i]) - 1, ORANGE);
            }
            it.printf(2, Y0 - 6,  id(lato10), LIGHTGRAY, "%.0f°", hi);
            it.printf(2, Y1 - 11, id(lato10), LIGHTGRAY, "%.0f°", lo);
          }

          // **** Hinweisbalken **** (siehe main_page)
          if (id(hint_left) > 0) {
            Color hbg = id(hint_level) == 2 ? RED : HA_BLUE;
            it.filled_rectangle(0, 196, 320, 44, hbg);
            it.printf(160, 218, id(lato30), BLACK, hbg, TextAlign::CENTER, "%s", id(hint_text).c_str());
          }

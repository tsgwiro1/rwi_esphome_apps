        continuous: true
        line_thickness: 5

# ============================================================ 
# Hardware related setup
#
# Setup SPI for the display. The ESP32-2432S028R uses separate SPI buses for display and touch
spi:
  - id: tft
    clk_pin: GPIO14
    mosi_pin: GPIO13
    miso_pin: GPIO12
  - id: touch
    clk_pin: GPIO25
    mosi_pin: GPIO32
    miso_pin: GPIO39

# Setup a pin to control the backlight
output:
  - platform: ledc
    pin: GPIO21
    id: backlight_pwm
  - platform: ledc
    pin: GPIO17
    id: led_now
    inverted: true
  - platform: ledc
    pin: GPIO27
    id: led_plan
    inverted: true

# Set up the xpt2046 touch platform
touchscreen:
  platform: xpt2046
  id: my_touchscreen
  spi_id: touch
  cs_pin: GPIO33
  interrupt_pin: GPIO36
  update_interval: 50ms
  threshold: 400
#  calibration:
#    x_min: 3860
#    x_max: 280
#    y_min: 3860
#    y_max: 340
#  transform:
#    swap_xy: true
#    mirror_x: false
  calibration:
    x_max: 3860
    x_min: 280
    y_max: 3860
    y_min: 340
  transform:
    swap_xy: true
    mirror_x: true
    mirror_y: true
  on_touch:
    - lambda: |-
          ESP_LOGI("cal", "x=%d, y=%d, x_raw=%d, y_raw=%0d",
              touch.x,
              touch.y,
              touch.x_raw,
              touch.y_raw
              );

# Setup the ili9xxx platform
#
# Update the UI state
interval:
  - interval: 1s
    then:
      - lambda: |-
          if (id(plan_setup_timeout_timer)) {
            id(plan_setup_timeout_timer)--;

            if (id(plan_setup_timeout_timer) == 0) {
              id(send_plan_request).execute();
              id(main_page).show();
            }
          }
  - interval: 2min
    then:
      - if:
          condition:
            - lambda: |-
                return !id(recent_touch);
          then: 
            - display.page.show: main_page
          else:
            - lambda: |-
                id(recent_touch) = false;

# Display is used as 240x320 by default so we rotate it to 90°
display:
  - platform: ili9xxx
    model: ili9342
    spi_id: tft
    cs_pin: GPIO15
    dc_pin: GPIO2
    color_order: rgb
    invert_colors: false
    id: my_display
    update_interval: 500ms
    color_palette: 8BIT
    pages:
      - id: main_page
        lambda: |-         
          //***********************************
          id(weather_animation).next_frame();
          it.image(0, 5, id(weather_animation), COLOR_ON, COLOR_OFF);
          it.line(0,80,320,80, HA_BLUE);
          it.image(0, 86, id(sun_icon));
          it.image(0, 123, id(plug_icon));
          it.line(160,85,160, 155, HA_BLUE);
          it.line(0,160,320,160, HA_BLUE);
          it.image(0, 165, id(wallbox_icon));
          //***********************************
          it.printf(90,0,id(lato24), WHITE,"%s",id(weather_condition).state.c_str());
          it.image(85, 42, id(thermometer_icon));       
          it.printf(112,38,id(lato20), WHITE,"%.1f °C", id(outside_temperature).state);
          if (id(raining).has_state()) {
            if (id(raining).state == true) {
              it.image(200, 47,  id(rain_icon));
              it.printf(240, 38, id(lato20), WHITE,"WET");
              it.printf(240, 63, id(lato14), WHITE, "%.0f Hz", id(rain_freq).state);
            } else {
              it.image(200, 47, id(dry_icon));
              it.printf(240,38, id(lato20), WHITE,"DRY");
            }
          } else {
              //it.image(200, 47, id(dry_icon));
              it.printf(240,38,id(lato20), WHITE,"---");
          }
          //** SOLAR *********************************
          if (id(solar_input).has_state()) {
            if (id(solar_input).state > -1000) {
              it.printf(65, 91, id(lato20), WHITE, "%.0f W", id(solar_input).state);     
            } else {
              it.printf(65, 91, id(lato20), WHITE, "%.0f W", id(solar_input).state);
            }
            if (id(solar_grid_power).state > 0) {
              it.printf(65, 126, id(lato20), LIGHTGREEN, "%.0f W", id(solar_grid_power).state);
            } else if (id(solar_grid_power).state < 0) {
              it.printf(65, 126, id(lato20), LIGHTRED, "%.0f W", abs(id(solar_grid_power).state));
            } else {
              it.printf(65, 126, id(lato20), WHITE, "%.0f W", id(solar_grid_power).state);
            }
          } else {
            it.printf(85, 113, id(lato14), WHITE, "---");
          }
          //** BATTERY *******************************
          if (id(solar_battery_soc).has_state()) {
              if (id(solar_battery_soc).state >= 80) it.image(170, 85, id(b100_icon));
              else if (id(solar_battery_soc).state >= 60) it.image(170, 85, id(b80_icon));
              else if (id(solar_battery_soc).state >= 40) it.image(170, 85, id(b60_icon));
              else if (id(solar_battery_soc).state >= 20) it.image(170, 85, id(b40_icon));
              else it.image(170, 85, id(b20_icon));
              it.printf(230, 94, id(lato20), WHITE, "%5.0f %%", id(solar_battery_soc).state);
              if (id(solar_battery_power).state > 0) {
                it.printf(230, 126, id(lato20), LIGHTGREEN, "%5.0f W", id(solar_battery_power).state);
              } else if (id(solar_battery_power).state < 0) {
                it.printf(230, 126, id(lato20), LIGHTRED, "%5.0f W", abs(id(solar_battery_power).state));
              } else {
                it.printf(230, 126, id(lato20), WHITE, "%5.0f W", id(solar_battery_power).state);
              }
          } else {
            it.printf(230, 113, id(lato14), WHITE, "---");
          }
          //** EV CHARGER ***************************
          if (id(grigio_connected).has_state()) {
            if (id(grigio_connected).state == true) {
              if (id(grigio_charging).state == true) {
                it.printf(90, 170, id(lato30), WHITE, "CHARGING");
                it.printf(90, 210, id(lato20), WHITE, "%.0f W / %.0f %% (%.0f km)", id(wallbox_charge_power).state, id(grigio_soc).state, id(grigio_range).state);
              } else {
                if (id(grigio_soc).state >= id(grigio_target_soc).state) {
                  it.printf(90, 185, id(lato30), WHITE, "DONE  -  %.0f %%", id(grigio_soc).state);
                } else {
                  if (id(evcc_chargeplan_enabled).state) {
                    it.printf(195, 172, id(lato24), WHITE, BLACK,TextAlign::TOP_CENTER, "READY");
                    it.printf(195, 204, id(lato20), WHITE, BLACK,TextAlign::TOP_CENTER, "Charge plan %s %.0f %%", id(evcc_charge_plan_time).state.c_str(), id(evcc_charge_plan_soc).state);
                  } else {
                    it.printf(160, 180, id(lato30), WHITE, BLACK,TextAlign::TOP_CENTER, "READY");
                    it.image(260, 180, id(ev_icon));
                  }
                }
              }
            } else {
              it.printf(160,180,id(lato20), WHITE, BLACK,TextAlign::TOP_CENTER, "nothing");
              it.printf(160,202,id(lato20), WHITE, BLACK,TextAlign::TOP_CENTER, "connected");
              it.image(270, 179, id(sun_icon));
              it.printf(285,212,id(lato14),WHITE, BLACK,TextAlign::TOP_CENTER, "%.0f%%", id(evcc_charge_30d_solar_percentage).state);
            }   
          } else {
            it.printf(85, 193, id(lato14), WHITE, "---");
          }
          //***********************************
      - id: ev_page
        lambda: |-
          it.image(0, 0, id(ev_icon));
          it.image(280, 0, id(back_icon));
          it.image(280, 189, id(sun_icon));
          it.printf(295,222,id(lato14),WHITE, BLACK,TextAlign::TOP_CENTER, "%.0f%%", id(evcc_charge_30d_solar_percentage).state);
          if (id(evcc_chargeplan_enabled).state) {
            it.image(10, 180, id(clock_icon));
            it.printf(28,220,id(lato14),WHITE, BLACK,TextAlign::TOP_CENTER, "%s", id(evcc_charge_plan_time).state.c_str());
            it.printf(28,163,id(lato14),WHITE, BLACK,TextAlign::TOP_CENTER, "%.0f%%", id(evcc_charge_plan_soc).state);
            if (id(grigio_connected).state && !id(grigio_charging).state) {
              it.printf(160,130,id(lato20),WHITE, BLACK,TextAlign::TOP_CENTER, "Plan active");  
              //it.printf(160,152,id(lato20),WHITE, BLACK,TextAlign::TOP_CENTER, "charge to %.0f % tomorrow at %s", id(evcc_charge_plan_soc).state, id(evcc_charge_plan_time).state.c_str());  
            }
          }
          if (id(grigio_connected).state) {
            if (id(grigio_charging).state) {
              it.printf(160,0,id(lato30), HA_BLUE, BLACK, TextAlign::TOP_CENTER, "Charging");
            } else {
              if (id(grigio_soc).state >= id(grigio_target_soc).state) {
                it.printf(160,0,id(lato30), HA_BLUE, BLACK, TextAlign::TOP_CENTER, "Charge done");
              } else {
                it.printf(160,0,id(lato30), HA_BLUE, BLACK, TextAlign::TOP_CENTER, "Charger ready");
              }
            }
            // **** SoC ****
            it.printf(2,79,id(lato20), WHITE, BLACK, TextAlign::TOP_LEFT, "SoC");
            it.printf(50,102,id(lato10),WHITE, BLACK,TextAlign::TOP_CENTER, "0%%"); it.printf(300,102,id(lato10),WHITE, BLACK,TextAlign::TOP_CENTER, "100%%");
            auto ch = 2.5 * id(grigio_soc).state;
            it.filled_rectangle(50,80,ch,20,GREEN); it.filled_rectangle(50+ch,80,250-ch,20,HA_BLUE);
            it.printf(160,78,id(lato20),WHITE, BLACK,TextAlign::BOTTOM_CENTER, "%.0f %% (%.0f km)", id(grigio_soc).state, id(grigio_range).state);
            // **** Power ****
            if (id(grigio_charging).state) {
              it.printf(2,139,id(lato20), WHITE, BLACK, TextAlign::TOP_LEFT, "Pow");
              it.printf(50,161,id(lato10),WHITE, BLACK,TextAlign::TOP_CENTER, "0kW"); it.printf(300,161,id(lato10),WHITE, BLACK,TextAlign::TOP_CENTER, "11kW");
              ch =  min (250.0, 0.023 * id(wallbox_charge_power).state);
              it.filled_rectangle(50,140,ch,20,LIGHTRED); it.filled_rectangle(50+ch,140,250-ch,20,HA_BLUE);
              it.printf(160,138,id(lato20),WHITE, BLACK, TextAlign::BOTTOM_CENTER, "%.0f W (%.0f A)", id(wallbox_charge_power).state, id(wallbox_charge_current).state);
            }
            // **** Mode ****
            if (id(wallbox_mode).state == "OFF") {
              it.filled_rectangle(60,180,56,56,GRAY); it.printf(88,196,id(lato20), WHITE, BLACK, TextAlign::TOP_CENTER, "OFF");
            } else {
              it.rectangle(60,180,56,56,GRAY); it.printf(88,196,id(lato20), GRAY, BLACK, TextAlign::TOP_CENTER, "OFF");
            }
            if (id(wallbox_mode).state == "PV") {
              it.filled_rectangle(132,180,56,56,GRAY); it.printf(160,196,id(lato20), WHITE, BLACK, TextAlign::TOP_CENTER, "PV");
            } else {
              it.rectangle(132,180,56,56,GRAY); it.printf(160,196,id(lato20), GRAY, BLACK, TextAlign::TOP_CENTER, "PV");
            }
            if (id(wallbox_mode).state == "NOW") {
              it.filled_rectangle(204,180,56,56,GRAY); it.printf(232,196,id(lato20), WHITE, BLACK, TextAlign::TOP_CENTER, "NOW");
            } else {
              it.rectangle(204,180,56,56,GRAY); it.printf(232,196,id(lato20), GRAY, BLACK, TextAlign::TOP_CENTER, "NOW");
            }
          } else {
            it.printf(160, 118, id(lato30), WHITE, BLACK, TextAlign::BOTTOM_CENTER, "Nothing");
            it.printf(160, 122, id(lato30), WHITE, BLACK, TextAlign::TOP_CENTER, "connected to wallbox");
          }
      - id: plan_setup_page
        lambda: |-
          it.image(0, 0, id(clock_icon));
          it.printf(160,0,id(lato30), HA_BLUE, BLACK, TextAlign::TOP_CENTER, "Charge Plan");
          it.printf(70,96,id(lato50), WHITE, BLACK, TextAlign::TOP_CENTER, "%02d", id(plan_time_hour));
          it.printf(110,96,id(lato50), WHITE, BLACK, TextAlign::TOP_CENTER, ":");
          it.printf(150,96,id(lato50), WHITE, BLACK, TextAlign::TOP_CENTER, "%02d", id(plan_time_minute));
          it.printf(250,96,id(lato50), WHITE, BLACK, TextAlign::TOP_CENTER, "%d%%", id(plan_soc));
          id(button_h_plus).state    ? it.image(40, 40, id(button_arrow_up_pressed))     : it.image(40, 40, id(button_arrow_up)); 
          id(button_min_plus).state  ? it.image(120, 40, id(button_arrow_up_pressed))    : it.image(120, 40, id(button_arrow_up)); 
          id(button_soc_plus).state  ? it.image(220, 40, id(button_arrow_up_pressed))    : it.image(220, 40, id(button_arrow_up)); 
          id(button_h_minus).state   ? it.image(40, 160, id(button_arrow_down_pressed))  : it.image(40, 160, id(button_arrow_down)); 
          id(button_min_minus).state ? it.image(120, 160, id(button_arrow_down_pressed)) : it.image(120, 160, id(button_arrow_down)); 
          id(button_soc_minus).state ? it.image(220, 160, id(button_arrow_down_pressed)) : it.image(220, 160, id(button_arrow_down)); 
      - id: bat_page
        lambda: |-
          it.image(0, 0, id(energy_icon));
          it.image(280, 0, id(back_icon));
          it.image(20, 70, id(batt_icon));
          it.printf(160,0,id(lato30), HA_BLUE, BLACK, TextAlign::TOP_CENTER, "Home Battery");
          it.printf(80,72,id(lato24), WHITE, BLACK, TextAlign::TOP_LEFT, "%5.0f %%", id(solar_battery_soc).state);
          it.image(170, 70, id(elect_icon));
          if (id(solar_battery_power).state > 0) {
            it.printf(223, 72, id(lato24), LIGHTGREEN, "%.0f W", id(solar_battery_power).state);
          } else if (id(solar_battery_power).state < 0) {
            it.printf(223, 72, id(lato24), LIGHTRED, "%.0f W", abs(id(solar_battery_power).state));
          } else {
            it.printf(223, 72, id(lato24), WHITE, "%.0f W", id(solar_battery_power).state);
          }
          it.graph(10, 130, id(home_bat_graph));
      - id: energy_page
        lambda: |-
          it.image(0, 0, id(energy_icon));
          it.image(280, 0, id(back_icon));
          it.printf(160,0,id(lato30), HA_BLUE, BLACK, TextAlign::TOP_CENTER, "Energy");
          // **** Electrical Power ****
          auto p_I_Solar = id(solar_input).state;
          auto p_I_Bat = abs(min((float)0.0, id(solar_battery_power).state));
          auto p_I_Grid = abs(min((float)0.0, id(solar_grid_power).state));
          auto p_I_Total = p_I_Solar + p_I_Grid + p_I_Bat;
          auto p_O_Grid = max((float)0.0, id(solar_grid_power).state);
          auto p_O_Bat = max((float)0.0, id(solar_battery_power).state);
          auto p_O_EV = id(wallbox_charge_power).state;
          auto p_O_Heater = id(heizstab_power).state;
          auto p_O_WP = id(wp_electric_power).state;
          auto p_O_House = p_I_Total - p_O_Grid - p_O_Bat - p_O_EV - p_O_Heater - p_O_WP;
          // **** Aux Power and Values ****
          auto p_WP_Heat = id(wp_heat_power).state;
          auto p_percent_heater = id(heizstab_power_percent).state;
          auto soc_Battery = id(solar_battery_soc).state;
          auto soc_EV = id(grigio_soc).state;
          // **** Energy Flow ****
          if (id(arr_anim) > 5) {
            id(arr_anim) = 0;
          }
          // ** Energy flow to commen consumers **
          it.image(105 + id(arr_anim) * 4,130, id(arrow_r_icon));
          it.image(129 + id(arr_anim) * 4,130, id(arrow_r_icon));
          it.image(153 + id(arr_anim) * 4,130, id(arrow_r_icon));
          it.image(177 + id(arr_anim) * 4,130, id(arrow_r_icon));
          // ** Energy flow to / from grid **
          if (id(solar_grid_power).state > 0) {
            if (id(arr_anim) < 3) it.image(46 - id(arr_anim) * 4,130, id(arrow_l_icon));  // ** push energy to the grid **
            it.image(70 - id(arr_anim) * 4,130, id(arrow_l_icon));  // ** push energy to the grid **
            it.image(94 - id(arr_anim) * 4,130, id(arrow_l_icon));  // ** push energy to the grid **
          } else if (id(solar_grid_power).state < 0) {
            if (id(arr_anim) > 3) it.image(22 + id(arr_anim) * 4,130, id(arrow_r_icon));  // ** get energy from grid **
            it.image(46 + id(arr_anim) * 4,130, id(arrow_r_icon));  // ** get energy from grid **
            it.image(70 + id(arr_anim) * 4,130, id(arrow_r_icon));  // ** get energy from grid **
            if (id(arr_anim) < 3) it.image(94 + id(arr_anim) * 4,130, id(arrow_r_icon));  // ** get energy from grid **
          }
          // ** Energy flow from solar **
          if (id(solar_input).state > 0) {
            if (id(arr_anim) > 0) it.image(103,76 + id(arr_anim) * 4, id(arrow_d_icon));
            it.image(103,100 + id(arr_anim) * 4, id(arrow_d_icon));
            if (id(arr_anim) < 2) it.image(103,124 + id(arr_anim) * 4, id(arrow_d_icon));
            //it.image(148,148 + id(arr_anim) * 4, id(arrow_d_icon));
          }
          // ** Energy flow to / from battery **
          if (id(solar_battery_power).state > 0) {
            if (id(arr_anim) > 3) it.image(103,117 + id(arr_anim) * 4, id(arrow_d_icon)); // ** charge battery **
            it.image(103,141 + id(arr_anim) * 4, id(arrow_d_icon)); // ** charge battery **
            it.image(103,165 + id(arr_anim) * 4, id(arrow_d_icon)); // ** charge battery **
            //it.image(103,189 + id(arr_anim) * 4, id(arrow_d_icon)); // ** charge battery **
          } else if (id(solar_battery_power).state < 0) {
            //it.image(103,117 - id(arr_anim) * 4, id(arrow_u_icon)); // ** discharge battery **
            if (id(arr_anim) < 3) it.image(103,141 - id(arr_anim) * 4, id(arrow_u_icon)); // ** discharge battery **
            it.image(103,165 - id(arr_anim) * 4, id(arrow_u_icon)); // ** discharge battery **
            if (id(arr_anim) > 0) it.image(103,189 - id(arr_anim) * 4, id(arrow_u_icon)); // ** discharge battery **
          }
          it.image(101,128, id(valve_icon));
          it.image(193,128, id(valve_icon));
          id(arr_anim) += 1;
          // **** Energy Distribution ****
          auto c = WHITE;
          it.image(10,115, id(powerline_icon));
          c = id(solar_grid_power).state > 0 ? LIGHTGREEN : LIGHTRED;
          it.printf(33,164,id(lato14), c, BLACK, TextAlign::TOP_CENTER, "%.0f W", p_I_Grid + p_O_Grid);
          it.image(92,50, id(solarpanel_icon));
          if (p_I_Solar > 0) it.printf(85,65,id(lato14), WHITE, BLACK, TextAlign::TOP_RIGHT, "%.0f W", p_I_Solar);
          it.image(190,65, id(wallbox_small_icon));
          if (soc_EV > 0) it.printf(210,63,id(lato14), WHITE, BLACK, TextAlign::BOTTOM_CENTER, "%.0f %%", soc_EV);
          if (p_O_EV > 0) it.printf(210,107,id(lato14), WHITE, BLACK, TextAlign::TOP_CENTER, "%.0f W", p_O_EV);
          it.image(265,85, id(airconditioning_icon));
          it.printf(285,83,id(lato14), YELLOW, BLACK, TextAlign::BOTTOM_CENTER, "%.0f W", p_WP_Heat);
          it.printf(285,127,id(lato14), WHITE, BLACK, TextAlign::TOP_CENTER, "%.0f W", p_O_WP);
          it.image(265,157, id(house_icon));
          it.printf(285,199,id(lato14), WHITE, BLACK, TextAlign::TOP_CENTER, "%.0f W", p_O_House);
          it.image(186,174, id(waterheater_icon));
          it.printf(206,173,id(lato14), WHITE, BLACK, TextAlign::BOTTOM_CENTER, "%.0f %%", p_percent_heater);
          it.printf(206,214,id(lato14), WHITE, BLACK, TextAlign::TOP_CENTER, "%.0f W", p_O_Heater);
          // x=98 statt 90: rueckt den Pol der Batterie auf x 113 und damit unter
          // die Pfeilspalte. Der Ladeblitz rechts im Symbol verschiebt dessen
          // optische Mitte nach rechts, der Pol sitzt entsprechend links davon.
          it.image(98,189, id(batteryhor_icon));
          it.printf(85,190,id(lato14), WHITE, BLACK, TextAlign::TOP_RIGHT, "%.0f %%", soc_Battery);
          c = id(solar_battery_power).state > 0 ? LIGHTGREEN : LIGHTRED;
          if (p_I_Bat + p_O_Bat > 0) it.printf(85,210,id(lato14), c, BLACK, TextAlign::TOP_RIGHT, "%.0f W", p_I_Bat + p_O_Bat);

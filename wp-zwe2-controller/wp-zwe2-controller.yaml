esphome:
  name: wp-zwe2-controller
  friendly_name: wp-zwe2-controller
  project:
    name: "tsgwiro1.wp-zwe2-controller"
    version: "${fw_version}"
  on_boot:
    then:
       lambda: !lambda |-
         id(heater_pwr).set_level(0);
         if (id(zwe2_heatsink_temp).state >= id(zwe2_fan_start_temp).state) {
           id(fan).turn_on();
           id(zwe2_fan).publish_state(true);
         } else {
           id(fan).turn_off();
           id(zwe2_fan).publish_state(false);
         }
         if (id(zwe2_heatsink_temp).state >= id(zwe2_max_temp).state) {
           id(zwe2_over_temp).publish_state(true);
         } else {
           id(zwe2_over_temp).publish_state(false);
         }
         id(boiler_temperature).get_component_state();

esp32:
  board: esp32dev
  framework:
    type: esp-idf

# HIER überschreiben wir die Grenzen für den starken ESP32
substitutions:
  fw_version: "1.2.0"
  grid_timeout_s: "300"     # ohne neuen Netzwert seit so vielen s -> Ansteuerung 0
  noflow_power_w: "100"     # darunter gilt der Heizstab als ohne Leistungsaufnahme
  noflow_delay_s: "300"     # so lange muss angefordert und nichts gemessen sein
  diag_min_heap_ok: "80000"       # 80kb ist gut für ESP32
  diag_min_heap_critical: "40000" # 40kb ist kritisch

packages:
  my_diagnostics: !include common/diagnostics.yaml
  my_ota: !include common/ota.yaml

#external_components:
#  - source: github://nrandell/dallasng

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: !secret zwe2controller_api_key

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: !secret zwe2controller_fallback_ap_ssid
    password: !secret zwe2controller_fallback_ap_password

web_server:
  port: 80
  ota: false
  version: 3

captive_portal:

i2c:
  sda: 21
  scl: 22
  scan: true
  id: i2cbus

pcf8574:
  - id: portexp
    address: 0x38
    pcf8575: false

#dallasng:
#  - pin: GPIO32
#    update_interval: 1s

# Example configuration entry
one_wire:
  - platform: gpio
    pin: GPIO32

output:
  - id: fan
    platform: gpio
    pin: GPIO23
  - id: heater_pwr
    platform: esp32_dac
    pin: GPIO25
  - id: ledboard_wlan
    platform: gpio
    pin:
      pcf8574: portexp
      number: 7
      mode:
        output: true
      inverted: true
  - id: ledboard_20
    platform: gpio
    pin:
      pcf8574: portexp
      number: 3
      mode:
        output: true
      inverted: true
  - id: ledboard_40
    platform: gpio
    pin:
      pcf8574: portexp
      number: 2
      mode:
        output: true
      inverted: true
  - id: ledboard_60
    platform: gpio
    pin:
      pcf8574: portexp
      number: 1
      mode:
        output: true
      inverted: true
  - id: ledboard_80
    platform: gpio
    pin:
      pcf8574: portexp
      number: 0
      mode:
        output: true
      inverted: true
  - id: ledboard_100
    platform: gpio
    pin:
      pcf8574: portexp
      number: 4
      mode:
        output: true
      inverted: true
  - id: ledboard_overtemp
    platform: gpio
    pin:
      pcf8574: portexp
      number: 5
      mode:
        output: true
      inverted: true
  - id: ledboard_modulpwr
    platform: gpio
    pin:
      pcf8574: portexp
      number: 6
      mode:
        output: true
      inverted: true

number:
  - platform: template
    name: "T Fan Start"
    device_class: TEMPERATURE
    unit_of_measurement: "°C"
    optimistic: true
    restore_value: true
    id: zwe2_fan_start_temp
    entity_category: "config"
    mode: box
    min_value: 0
    max_value: 100
    step: 0.1

  - platform: template
    name: "Tmax Module"
    device_class: TEMPERATURE
    unit_of_measurement: "°C"
    optimistic: true
    restore_value: true
    id: zwe2_max_temp
    entity_category: "config"
    mode: box
    min_value: 0
    max_value: 100
    step: 0.1

  - platform: template
    name: "Tmax Boiler"
    device_class: TEMPERATURE
    unit_of_measurement: "°C"
    optimistic: true
    restore_value: true
    id: zwe2_max_temp_boiler
    entity_category: "config"
    mode: box
    min_value: 0
    max_value: 110
    step: 0.1

  - platform: template
    name: "Power Solar Min"
    device_class: POWER
    unit_of_measurement: "W"
    optimistic: true
    restore_value: true
    id: zwe2_min_solar_power
    entity_category: "config"
    mode: box
    min_value: 0
    max_value: 10000
    step: 100

  - platform: template
    name: "Power Heater"
    device_class: POWER
    unit_of_measurement: "W"
    optimistic: true
    restore_value: true
    id: zwe2_heater_power
    entity_category: "config"
    mode: box
    min_value: 0
    max_value: 10000
    step: 100

  - platform: template
    name: "Min Heater Output"
    unit_of_measurement: "%"
    icon: mdi:flash
    optimistic: true
    restore_value: true
    id: zwe2_min_output
    entity_category: "config"
    mode: box
    min_value: 0
    max_value: 100
    step: 0.1

  - platform: template
    name: "0% Power"
    unit_of_measurement: V
    icon: mdi:flash
    optimistic: true
    restore_value: true
    id: zwe2_min_output_volt
    entity_category: "config"
    mode: box
    min_value: 0.0
    max_value: 10.0
    step: 0.01

  - platform: template
    name: "100% Power"
    unit_of_measurement: V
    icon: mdi:flash
    optimistic: true
    restore_value: true
    id: zwe2_max_output_volt
    entity_category: "config"
    mode: box
    min_value: 0.0
    max_value: 10.0
    step: 0.01

  - platform: template
    name: "Hyst Fan"
    unit_of_measurement: "K"
    optimistic: true
    restore_value: true
    id: zwe2_hyst_fan
    entity_category: "config"
    mode: box
    min_value: 0
    max_value: 25
    step: 0.1

  - platform: template
    name: "Hyst Charge"
    unit_of_measurement: "K"
    optimistic: true
    restore_value: true
    id: zwe2_hyst_charge
    entity_category: "config"
    mode: box
    min_value: 0
    max_value: 25
    step: 0.1

  # Ersatzfuehler liest um diesen Betrag hoeher als S1 (Einbauhoehe)
  - platform: template
    name: "Offset Backup"
    unit_of_measurement: "K"
    optimistic: true
    restore_value: true
    initial_value: 2.25
    id: zwe2_backup_offset
    entity_category: "config"
    mode: box
    min_value: -10
    max_value: 10
    step: 0.05

switch:
  - platform: template
    name: "Main Power On-Off"
    id: zwe2_main_on_off
    restore_mode: RESTORE_DEFAULT_ON
    optimistic: true
    device_class: SWITCH

  - platform: template
    name: "Override Mode"
    id: zwe2_override
    restore_mode: ALWAYS_OFF
    optimistic: true
    device_class: SWITCH

binary_sensor:
  - platform: template
    name: "1.0 Over Temperature"
    device_class: PROBLEM
    id: zwe2_over_temp
    entity_category: "diagnostic"

  - platform: template
    name: "Boiler Temperature"
    device_class: HEAT
    id: zwe2_boiler_charged

  - platform: template
    name: "Fan"
    device_class: RUNNING
    id: zwe2_fan

  - platform: template
    name: "1.2 Keine Leistungsaufnahme"
    device_class: PROBLEM
    id: zwe2_no_flow
    entity_category: "diagnostic"

  - platform: homeassistant
    internal: true
    entity_id: binary_sensor.infrastructure_wp_speicher_monitor_1_0_fuehler_watchdog
    id: s1_watchdog

  - platform: gpio
    pin: 
     number: GPIO33
     mode:
       input: true
       pulldown: true
    device_class: POWER
    name: "Module Power"
    id: zwe2_modul_power

sensor:
  - platform: homeassistant
    name: none
    internal: True
    entity_id: sensor.grid_active_power    #input_number.test_solar_surplus_power
    on_value:
      lambda: !lambda |-
         id(solar_power) = x;
         id(grid_last_ms) = millis();
         if (id(zwe2_override).state == false) {
           id(solar_power) += id(output_power) * id(zwe2_heater_power).state;
         }
         ESP_LOGD("Solar", "Grid Power: %.0fW Netto Power: %.0fW", x, id(solar_power));

  - platform: homeassistant
    name: none
    internal: True
    entity_id: sensor.s1   #input_number.test_boiler_temp
    id: boiler_temperature
    on_value:
      - script.execute: eval_boiler

  - platform: homeassistant
    name: none
    internal: True
    entity_id: sensor.wp_temperatur_warmwasser
    id: boiler_temperature_backup
    on_value:
      - script.execute: eval_boiler

  - platform: homeassistant
    name: none
    internal: True
    entity_id: sensor.heizstab
    id: heater_measured

  - platform: homeassistant
    name: none
    internal: True
    entity_id: sensor.charge_discharge_power
    id: battery_charge_discharge
    on_value:
      lambda: !lambda |-
         if (x < 0.0) {
           id(battery_discharge) = abs(x);
         } else {
           id(battery_discharge) = 0.0;
         }
         ESP_LOGD("Battery", "Discharge: %.0fW", id(battery_discharge));

  - platform: wifi_signal
    internal: true
    id: zwe2_wifi_signal_db
    update_interval: 60s
    on_value:
      lambda: !lambda |-
         if (id(zwe2_wifi_signal_db).state >= -70) {
             id(ledboard_wlan).turn_on();
         } else {
          id(ledboard_wlan).turn_off();
         }

  - platform: dallas_temp
    address: 0x190218301866ff28
    name: "Heatsink Temperature"
    id: zwe2_heatsink_temp
    resolution: 10
    update_interval: 10s
    filters:
      - sliding_window_moving_average:
          window_size: 10
          send_every: 10
    on_value:
      lambda: !lambda |-
         if (id(zwe2_heatsink_temp).state >= id(zwe2_fan_start_temp).state) {
           id(fan).turn_on();
           id(zwe2_fan).publish_state(true);
         } 
         if (id(zwe2_heatsink_temp).state < id(zwe2_fan_start_temp).state - id(zwe2_hyst_fan).state) {
           id(fan).turn_off();
           id(zwe2_fan).publish_state(false);
         }
         if (id(zwe2_heatsink_temp).state >= id(zwe2_max_temp).state) {
           id(zwe2_over_temp).publish_state(true);
         }
         if (id(zwe2_heatsink_temp).state < id(zwe2_max_temp).state - (2 * id(zwe2_hyst_fan).state)) {
           id(zwe2_over_temp).publish_state(false);
         }
         id(zwe2_heatsink_temp).publish_state(id(zwe2_heatsink_temp).state);

  - platform: template
    name: Output Power
    id: zwe2_output
    update_interval: 2s
    icon: mdi:flash
    unit_of_measurement: "%"
    accuracy_decimals: 0
    lambda: |-
      return (int)(id(output_power)*100.0+0.5);

  # 1 solange Leistung angefordert wird, sonst 0 - Quelle der Betriebsstunden
  - platform: copy
    source_id: zwe2_output
    id: zwe2_heating
    internal: true
    filters:
      - lambda: |-
          return x > 0 ? 1.0f : 0.0f;

  - platform: integration
    name: Betriebsstunden
    id: zwe2_operating_hours
    sensor: zwe2_heating
    time_unit: h
    integration_method: left
    restore: true
    unit_of_measurement: "h"
    device_class: duration
    state_class: total_increasing
    accuracy_decimals: 2
    icon: mdi:timer-outline
    filters:
      - delta: 0.05   # nur alle 3 min Heizbetrieb nach HA melden

text_sensor:
  - platform: template
    name: "1.1 Speicherfuehler"
    id: zwe2_boiler_source
    entity_category: "diagnostic"
    icon: mdi:thermometer-check

time:
  - platform: homeassistant
    id: the_loop
    on_time:
      seconds: /5
      then:
        - script.execute: set_Power

globals:
  - id: solar_power
    type: float
    restore_value: no
    initial_value: '0'
  - id: output_power
    type: float
    restore_value: no
    initial_value: '0'
  - id: battery_discharge
    type: float
    restore_value: no
    initial_value: '0'
  # Letzter Zustand der Speicherverriegelung, gilt nach einem Neustart im Totband
  - id: boiler_charged_mem
    type: bool
    restore_value: yes
    initial_value: 'true'
  - id: grid_last_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: no_flow_since_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'

script:
  # Speicherverriegelung: Quelle waehlen (S1, sonst Ersatzfuehler, sonst keine)
  # und gegen Tmax Boiler mit Hysterese bewerten. Ohne gueltigen Wert gesperrt.
  - id: eval_boiler
    then:
      - lambda: !lambda |-
          float t = NAN;
          std::string src = "keiner";
          bool s1_ok = !std::isnan(id(boiler_temperature).state)
                       && id(s1_watchdog).has_state() && !id(s1_watchdog).state;
          if (s1_ok) {
            t = id(boiler_temperature).state;
            src = "S1";
          } else if (!std::isnan(id(boiler_temperature_backup).state)) {
            t = id(boiler_temperature_backup).state - id(zwe2_backup_offset).state;
            src = "Backup WW";
          }
          bool charged;
          if (std::isnan(t)) {
            charged = true;
          } else if (t >= id(zwe2_max_temp_boiler).state) {
            charged = true;
            id(boiler_charged_mem) = true;
          } else if (t < id(zwe2_max_temp_boiler).state - id(zwe2_hyst_charge).state) {
            charged = false;
            id(boiler_charged_mem) = false;
          } else {
            charged = id(boiler_charged_mem);
          }
          if (!id(zwe2_boiler_source).has_state() || id(zwe2_boiler_source).state != src) {
            id(zwe2_boiler_source).publish_state(src);
          }
          if (!id(zwe2_boiler_charged).has_state() || id(zwe2_boiler_charged).state != charged) {
            id(zwe2_boiler_charged).publish_state(charged);
            ESP_LOGI("Boiler", "Quelle: %s  Temperatur: %.2f°C  Speicher geladen: %s", src.c_str(), t, charged ? "Ja" : "Nein");
          }

  - id: set_Power
    then:
      - lambda: !lambda |-
          float pwr = 0.0;
          float out = 0.0;
          float map_dac = 0.0;
          id(eval_boiler).execute();
          bool grid_ok = id(grid_last_ms) != 0 && (millis() - id(grid_last_ms)) < ${grid_timeout_s} * 1000UL;
          if (id(zwe2_over_temp).state || id(zwe2_main_on_off).state == false || id(zwe2_modul_power).state == false || id(zwe2_boiler_charged).state) {
            id(output_power) = 0.0;
          } else {
            if (id(zwe2_override).state) {
              id(output_power) = 1.0;
            } else if (!grid_ok) {
              id(output_power) = 0.0;
              ESP_LOGW("Solar", "Kein neuer Netzwert seit über ${grid_timeout_s} s, Ansteuerung 0");
            } else {
              pwr = max((double)(id(solar_power) - id(zwe2_min_solar_power).state - id(battery_discharge)), 0.0);
              out = min(1.0 / id(zwe2_heater_power).state * pwr, 1.0);
              if (out >= id(zwe2_min_output).state / 100.0) {
                id(output_power) = out;
              } else {
                id(output_power) = 0.0;
              }
            }
          }
          // Rueckmeldung: angefordert, aber keine Leistungsaufnahme gemessen
          float meas = id(heater_measured).state;
          bool demand = id(output_power) > 0.0 && id(output_power) >= id(zwe2_min_output).state / 100.0;
          if (demand && !std::isnan(meas) && meas < ${noflow_power_w}) {
            if (id(no_flow_since_ms) == 0) id(no_flow_since_ms) = millis();
            if (millis() - id(no_flow_since_ms) >= ${noflow_delay_s} * 1000UL) {
              id(zwe2_no_flow).publish_state(true);
            }
          } else {
            id(no_flow_since_ms) = 0;
            id(zwe2_no_flow).publish_state(false);
          }
          if (id(output_power) > 0.0) {
            map_dac = ((id(zwe2_max_output_volt).state - id(zwe2_min_output_volt).state)*id(output_power)+id(zwe2_min_output_volt).state)/id(zwe2_max_output_volt).state;
            map_dac = map_dac < 0.0 ? 0.0:map_dac > 1.0 ? 1.0:map_dac;
          }
          id(heater_pwr).set_level(map_dac);
          id(set_LED_Board).execute();
          ESP_LOGD("Script", "Output: %.1f%% (%.1f%%) Power: %.0fW DAC: %.3f%", id(output_power) * 100, out * 100, id(output_power) * id(zwe2_heater_power).state, map_dac);

  - id: set_LED_Board
    then:
      - lambda: !lambda |-
          if (id(output_power) > 0.2) {
            id(ledboard_20).turn_on();
          } else {
            id(ledboard_20).turn_off();
          }
          if (id(output_power) > 0.4) {
            id(ledboard_40).turn_on();
          } else {
            id(ledboard_40).turn_off();
          }
          if (id(output_power) > 0.6) {
            id(ledboard_60).turn_on();
          } else {
            id(ledboard_60).turn_off();
          }
          if (id(output_power) > 0.8) {
            id(ledboard_80).turn_on();
          } else {
            id(ledboard_80).turn_off();
          }
          if (id(output_power) >= 1.0) {
            id(ledboard_100).turn_on();
          } else {
            id(ledboard_100).turn_off();
          }
          if (id(zwe2_modul_power).state == false) {
            id(ledboard_modulpwr).turn_on();
          } else {
            id(ledboard_modulpwr).turn_off();
          }
          if (id(zwe2_over_temp).state) {
            id(ledboard_overtemp).turn_on();
          } else {
            id(ledboard_overtemp).turn_off();
          }
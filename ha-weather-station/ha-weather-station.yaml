esphome:
  name: ha-weather-station
  friendly_name: ha-weather-station
  project:
    name: "tsgwiro1.ha-weather-station"
    version: "${fw_version}"

# Startwerte direkt beim Booten setzen
  on_boot:
    priority: -100 # Wartet, bis alle internen Sensoren bereit sind
    then:
      - lambda: |-
          // 1. Kalibrierungs-Sensoren initialisieren
          id(cal_status).publish_state("Initialisiere...");
          id(cal_active).publish_state(false);

          // 2. SHT-Wartungssensoren initialisieren
          id(sht_service_status).publish_state("Normalbetrieb");
          id(sht_service_active).publish_state(false);

          // 3. Regen-Status einmalig setzen (danach nur noch bei Flankenwechsel)
          id(rain_binary).publish_state(id(is_raining));
          id(rain_recent).publish_state(id(rain_recent_state));

          // 4. Heizungs-Störung initialisieren
          id(heater_fault).publish_state(false);

          // 5. Kalibrier-Wartezeit ab jetzt rechnen.
          //    Mit dem Startwert 0 wäre (millis() - time_since_dry) sofort grösser
          //    als jede eingestellte Wartezeit. Nach einem Reboot kurz nach dem
          //    Regen entfiele der Calibration delay damit vollständig und der
          //    Sensor könnte auf eine noch feuchte Frequenz kalibrieren.
          id(time_since_dry) = millis();

          // 6. PID-Regler beim Start hart auf AUS zwingen
          auto call = id(rain_heater_pid).make_call();
          call.set_mode(climate::CLIMATE_MODE_OFF);
          call.perform();

# Hier wird das Board definiert
esp32:
  board: esp32dev
  framework:
    type: esp-idf
    
# Speichert Einstellungen (Nummern, Dropdowns) im Flash-Speicher
# 10 min statt 1 min: Der PID-Regler sichert bei jedem Sollwertwechsel seinen
# Zustand ins NVS; ein kurzes Intervall führt zu dauerhaftem Flash-Verschleiss.
preferences:
  flash_write_interval: 10min

substitutions:
  fw_version: "3.0.0"
  # ESP32
  # ANPASSUNG DER DIAGNOSE-GRENZWERTE
  diag_min_heap_ok: "80000"       # 80kb ist gut für ESP32
  diag_min_heap_critical: "40000" # 40kb ist kritisch

  # SCHUTZGRENZEN DER SENSORHEIZUNG - beide schalten den PID zwingend ab.
  #
  # Unten: Plausibilitätsgrenze für den NTC. Ein defekter Fühler meldet kein NaN,
  #        sondern eine plausibel aussehende Zahl: sowohl bei Kurzschluss (über
  #        log(0)) als auch bei offener Leitung (über den sehr grossen
  #        Widerstand) landet die Rechnung bei rund -273 °C. Beide Fehlerfälle
  #        laufen also nach unten - die untere Grenze fängt sie ab.
  # Oben:  Übertemperatur-Abschaltung. Das Kunststoffteil, in dem der Sensor
  #        sitzt, verträgt keine höheren Temperaturen. Die Heizleistung auf dem
  #        Keramiksubstrat reicht im Normalfall ohnehin nicht so weit; wird der
  #        Wert dennoch erreicht, stimmt etwas nicht.
  #        Muss über 'Heater Max Temperature' liegen (dort auf 50 °C begrenzt),
  #        damit ein regulärer Sollwert die Abschaltung nie auslöst - 10 K Reserve.
  ntc_min_plausible: "-30.0"

  # Mindestabstand der beiden Nass-Schwellen als Anteil der Trockenfrequenz.
  # 0.01 entspricht rund 327 Hz und liegt damit über dem gemessenen Rauschen
  # (184 Hz Standardabweichung, Einbruch p90 518 Hz innerhalb einer trockenen
  # Stunde). Wird die Ausschaltschwelle näher an die Einschaltschwelle gelegt,
  # hebt die Logik sie auf diesen Abstand an.
  wet_band_min: "0.01"
  heater_cutout_temp: "60.0"

packages:
  my_diagnostics: !include common/diagnostics.yaml

# Enable logging
logger:
  level: DEBUG 
  logs:
    sensor: INFO
    climate: INFO
    pulse_counter: INFO

# Local Webserver
web_server:
  port: 80
  ota: false
  version: 3

# Enable Home Assistant API
api:
  encryption:
    key: !secret weatherstation_api_key

ota:
  platform: esphome
  password: !secret weatherstation_ota_key

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  min_auth_mode: WPA2

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: !secret weatherstation_fallback_ap_ssid
    password: !secret weatherstation_fallback_ap_password

captive_portal:

i2c:
  id: i2c_bus
  sda: GPIO21
  scl: GPIO22
  scan: true

# --------------------------------------------------------
# DYNAMISCHE EINSTELLUNGEN FÜR HOME ASSISTANT
# Alle Felder als Eingabebox ('mode: box') 
# und gruppiert ('entity_category: config')
# --------------------------------------------------------
select:
  - platform: template
    name: "Heater Source"
    id: heater_source
    optimistic: true
    options:
      - "Dew Point"
      - "Ambient"
    initial_option: "Dew Point"
    restore_value: true
    entity_category: config

number:
  - platform: template
    name: "Barometer Elevation Correction"
    id: baro_corr
    optimistic: true
    min_value: -200.0
    max_value: 200.0
    step: 0.1
    initial_value: 0.0
    restore_value: true
    unit_of_measurement: "hPa"
    mode: box
    entity_category: config

  # Beide Klemmungen enden bei 50 °C - höher lässt die Max-Klemmung den Sollwert
  # ohnehin nicht, ein einstellbarer Minimalwert darüber wäre nur ein sinnloser
  # Zustand (Min > Max, wobei Max gewinnt).
  - platform: template
    name: "Heater Min Temperature"
    id: heater_min_temp
    optimistic: true
    min_value: 0
    max_value: 50
    step: 1
    initial_value: 10
    restore_value: true
    mode: box
    entity_category: config

  # Obergrenze bewusst bei 50 °C: die Übertemperatur-Abschaltung liegt bei
  # ${heater_cutout_temp} °C, ein einstellbarer Sollwert darüber würde sie im
  # Normalbetrieb auslösen und als Störung gemeldet.
  - platform: template
    name: "Heater Max Temperature"
    id: heater_max_temp
    optimistic: true
    min_value: 0
    max_value: 50
    step: 1
    initial_value: 50
    restore_value: true
    mode: box
    entity_category: config

  - platform: template
    name: "Heater Temperature Elevation"
    id: heater_elevation
    optimistic: true
    min_value: 0
    max_value: 50
    step: 1
    initial_value: 10
    restore_value: true
    mode: box
    entity_category: config

  - platform: template
    name: "Range for Calibration"
    id: cal_range
    optimistic: true
    min_value: 0.01
    max_value: 0.2
    step: 0.01
    initial_value: 0.04
    restore_value: true
    mode: box
    entity_category: config

  # Die beiden Nass-Schwellen sind unabhängige Anteile der Trockenfrequenz und
  # dürfen einzeln bewegt werden. Bis V1.1.0 hiessen sie «Trigger point Rain»
  # und «Rain trigger hysteresis»; dort hing die Ausschaltschwelle über die
  # Hysterese am Trigger point statt an freq_dry und wanderte bei empfindlicher
  # Einstellung über die Trockenfrequenz hinaus - das Gerät wäre nie mehr auf
  # «trocken» zurückgekommen. Genau das hat die Empfindlichkeit blockiert.
  #
  # Die Startwerte bilden die bewährte Einstellung 0.94/0.03 exakt nach:
  # 0.94 × (1 - 0.03/2) = 0.926 und 0.94 × (1 + 0.03/2) = 0.954.
  #
  # Untergrenze 0.5: darunter wäre die Schwelle so tief, dass sie nur noch bei
  # stehendem Wasser anspricht. Das Rauschen liegt bei rund 2 % von freq_dry -
  # ein Abstand der beiden Schwellen unter wet_band_min ist deshalb sinnlos
  # und wird in der Logik angehoben.
  - platform: template
    name: "Rain Threshold Wet"
    id: wet_on
    optimistic: true
    min_value: 0.5
    max_value: 1.0
    step: 0.001
    initial_value: 0.926
    restore_value: true
    mode: box
    entity_category: config

  - platform: template
    name: "Rain Threshold Dry"
    id: wet_off
    optimistic: true
    min_value: 0.5
    max_value: 1.0
    step: 0.001
    initial_value: 0.954
    restore_value: true
    mode: box
    entity_category: config

  - platform: template
    name: "Calibration delay [min]"
    id: cal_delay_min
    optimistic: true
    min_value: 1
    max_value: 120
    step: 1
    initial_value: 30
    restore_value: true
    mode: box
    entity_category: config

  - platform: template
    name: "SHT Heater Time [min]"
    id: sht_heat_time
    optimistic: true
    min_value: 1
    max_value: 30
    step: 1
    initial_value: 5
    restore_value: true
    mode: box
    entity_category: config

  # 12 min statt der urspruenglichen 3: Nach dem Zyklus vom 22.08.2026
  # gemessen klingt der Heizeffekt mit einer Zeitkonstante von rund 4.5 min ab.
  # Bei 3 min lag der erste wieder publizierte Wert gut 1 %RH zu tief, bei
  # 12 min bleiben rund 0.1 %RH - die Wiederholbarkeit des Sensors.
  - platform: template
    name: "SHT Recovery Time [min]"
    id: sht_recovery_time
    optimistic: true
    min_value: 1
    max_value: 30
    step: 1
    initial_value: 12
    restore_value: true
    mode: box
    entity_category: config

  # Abstand zwischen zwei Wartungszyklen des SHT31-Heizers. Sensirion nennt
  # zwei Zwecke fuer diesen Heizer: Plausibilitaetspruefung (Datenblatt 4.10)
  # und das Austreiben von Verunreinigungen (Handling Instructions 3). Beides
  # ist eine wiederkehrende Wartung, kein Ereignis - deshalb ein Zeitintervall
  # und keine Feuchteschwelle. 0 schaltet den Zyklus ab.
  - platform: template
    name: "SHT Maintenance Interval [d]"
    id: sht_cycle_days
    optimistic: true
    min_value: 0
    max_value: 30
    step: 1
    initial_value: 7
    restore_value: true
    mode: box
    entity_category: config

  - platform: template
    name: "Rain Off Delay [min]"
    id: rain_off_delay_min
    optimistic: true
    min_value: 0
    max_value: 60
    step: 1
    initial_value: 3
    restore_value: true
    mode: box
    entity_category: config

  # Haltezeit der zweiten Regen-Entität «Regen kürzlich». Der beheizte Sensor
  # trocknet zwischen zwei Schauern in Minuten ab - an den Regentagen vom
  # 21.08. und 28.08.2026 lag die Frequenz in den Lücken (28-227 min) im
  # Stundenmittel exakt auf Vorregen-Niveau. Die Zerhackung ist also echt und
  # mit Schwellen nicht behebbar; wer «hat es kürzlich geregnet?» beantworten
  # will, braucht diese zweite Entität.
  - platform: template
    name: "Rain Hold Time [min]"
    id: rain_hold_min
    optimistic: true
    min_value: 0
    max_value: 180
    step: 5
    initial_value: 45
    restore_value: true
    mode: box
    entity_category: config

# --------------------------------------------------------
# GLOBALE VARIABLEN (Unsichtbares "Gedächtnis")
# --------------------------------------------------------
globals:
  - id: freq_dry
    type: float
    restore_value: true
    initial_value: '32000.0'
  - id: is_raining
    type: bool
    initial_value: 'false'
  - id: rain_recent_state
    type: bool
    initial_value: 'false'
  - id: time_since_dry
    type: uint32_t
    initial_value: '0'
  - id: sht_heating_active
    type: bool
    initial_value: 'false'

# --------------------------------------------------------
# SKRIPTE (Für das Blitzen der Activity LED)
# --------------------------------------------------------
script:
  # 1. Activity Flash (50ms)
  - id: flash_activity
    mode: restart
    then:
      - output.turn_on: led_activity
      - delay: 50ms
      - output.turn_off: led_activity

  # 2. SHT31 Wartungszyklus (Heizer)
  - id: sht_service_cycle
    mode: single 
    then:
      # Zyklus startet
      - globals.set:
          id: sht_heating_active
          value: 'true'
      - lambda: |-
          id(sht_service_status).publish_state("Heizt (Wartungszyklus)");
          id(sht_service_active).publish_state(true);
          
      # ESPHome Native I2C Write via C++ Lambda (Heizung EIN)
      - lambda: |-
          uint8_t data_on[2] = {0x30, 0x6D};
          id(i2c_bus)->write(0x44, data_on, 2, true);
          
      # Dynamische Pause (Heizzeit)
      - delay: !lambda "return id(sht_heat_time).state * 60000;"
      
      # Heizung geht aus, Abkühlphase beginnt
      - lambda: 'id(sht_service_status).publish_state("Abkühlphase");'
      
      # ESPHome Native I2C Write via C++ Lambda (Heizung AUS)
      - lambda: |-
          uint8_t data_off[2] = {0x30, 0x66};
          id(i2c_bus)->write(0x44, data_off, 2, true);
          
      # Dynamische Pause (Erholungszeit)
      - delay: !lambda "return id(sht_recovery_time).state * 60000;"
      
      # Zyklus komplett beendet
      - globals.set:
          id: sht_heating_active
          value: 'false'
      - lambda: |-
          id(sht_service_status).publish_state("Normalbetrieb");
          id(sht_service_active).publish_state(false);

# --------------------------------------------------------
# LOGIK-SCHLEIFEN (Regen, Heizung, LEDs)
# --------------------------------------------------------
interval:
  # RGB Status Prüfung alle 2 Sekunden
  - interval: 2s
    then:
      - lambda: |-
          if (api::global_api_server->is_connected()) {
            id(led_red).turn_off();
            id(led_green).turn_on();
            id(led_blue).turn_off();
          } else if (wifi::global_wifi_component->is_connected()) {
            id(led_red).turn_off();
            id(led_green).turn_off();
            id(led_blue).turn_on();
          } else {
            id(led_red).turn_on();
            id(led_green).turn_off();
            id(led_blue).turn_off();
          }

  # Sensor-Heizung-Logik alle 1 Sekunden
  # Haupt-Wetter-Logik alle 10 Sekunden
  - interval: 10s
    then:
      - lambda: |-
          // --- 1. ZIELTEMPERATUR BERECHNEN UND AN PID SENDEN ---
          float source_temp = (id(heater_source).current_option() == "Dew Point") ? id(dewpoint_shed).state : id(temp_shed).state;
          float elev = id(heater_elevation).state;
          
          float target_temp = source_temp + elev;
          // Min/Max Begrenzung
          if (target_temp < id(heater_min_temp).state) target_temp = id(heater_min_temp).state;
          if (target_temp > id(heater_max_temp).state) target_temp = id(heater_max_temp).state;
            
          // Jeder perform() am PID löst intern ein publish_state() (HA-Traffic)
          // UND ein save_state_() ins NVS (Flash-Verschleiss) aus. Deshalb wird
          // der Regler nur noch angefasst, wenn sich Modus oder Sollwert wirklich
          // ändern - die Regelung selbst läuft davon unabhängig autonom weiter.
          static bool pid_mode_heat = false;
          static float pid_last_target = NAN;
          static bool pid_initialized = false;

          // SCHUTZ DER SENSORHEIZUNG - zwei getrennte Gründe, damit die Diagnose
          // sagen kann, welcher zugetroffen hat.
          //
          // Unten: Ein defekter Fühler meldet kein NaN, sondern eine plausibel
          // aussehende Zahl - Kurzschluss wie offene Leitung landen bei rund
          // -273 °C. Der PID bildet daraus einen riesigen Regelfehler und fährt
          // die Heizung dauerhaft auf 100 %; PIDClimate::update_pid_() fängt nur
          // NaN ab, diesen Fall nicht.
          // Oben: Übertemperatur. Sollte die Regelung nie erreichen, weil der
          // Sollwert auf 50 °C begrenzt ist.
          float heater_now = id(heater_temp_fast).state;
          bool ntc_plausible   = !std::isnan(heater_now) && heater_now > ${ntc_min_plausible};
          bool heater_temp_ok  = !std::isnan(heater_now) && heater_now < ${heater_cutout_temp};
          bool heater_sensor_ok = ntc_plausible && heater_temp_ok;
          bool heater_target_ok = !std::isnan(source_temp) && !std::isnan(elev);

          // FAILSAFE: Ohne gültigen Sollwert ODER ohne plausiblen Istwert bleibt
          // die Heizung zwingend aus.
          if (!heater_target_ok || !heater_sensor_ok) {
            if (!pid_initialized || pid_mode_heat) {
              auto call = id(rain_heater_pid).make_call();
              call.set_mode(climate::CLIMATE_MODE_OFF);
              call.perform();
              pid_mode_heat = false;
              pid_last_target = NAN;
              pid_initialized = true;
            }
          } else {
            // SENSOR-DATEN GÜLTIG -> Zieltemperatur berechnen und Heizung EIN!
            bool target_changed = std::isnan(pid_last_target) ||
                                  fabsf(target_temp - pid_last_target) >= 0.1f;
            if (!pid_initialized || !pid_mode_heat || target_changed) {
              auto call = id(rain_heater_pid).make_call();
              call.set_mode(climate::CLIMATE_MODE_HEAT); // Schaltet den Regler aktiv
              call.set_target_temperature(target_temp);  // Übergibt das neue Ziel
              call.perform();
              pid_mode_heat = true;
              pid_last_target = target_temp;
              pid_initialized = true;
            }
          }

          // Störungsmeldung nur bei Änderung - der Zustand kippt im Normalfall nie.
          static bool last_fault = false;
          static bool fault_valid = false;
          if (!fault_valid || (!heater_sensor_ok) != last_fault) {
            id(heater_fault).publish_state(!heater_sensor_ok);
            last_fault = !heater_sensor_ok;
            fault_valid = true;
          }

          // --- 2. REGEN- & KALIBRIERUNGS-LOGIK ---
          float f = id(rain_freq).state;
          // Der schnelle Istwert (2 s), nicht die auf 60 s gemittelte
          // HA-Schaufenster-Entität. Sonst wird ein bis zu eine Minute alter
          // Mittelwert gegen einen frischen Sollwert verglichen und der
          // Kalibrierstatus flattert beim Aufheizen zwischen «Heizt auf» und
          // «Kalibriert» - am 14. und 16.08.2026 mehrfach für je 10 s beobachtet.
          float current_temp = heater_now;

          std::string status_msg = "Initialisiere...";
          bool is_calibrating = false;

          // Ein statischer Timer, der sich merkt, wann der Sensor zuletzt nass war
          static uint32_t last_wet_time = millis();

          // Prüfen, ob der Frequenzzähler schon gültige Werte liefert
          if (std::isnan(f) || f <= 0) {
            status_msg = "Warte auf Sensorwerte";
          } else {
            // Beide Schwellen sind unabhängige Anteile der Trockenfrequenz.
            // Damit folgt auch die Ausschaltschwelle dem Temperaturgang des
            // Oszillators, statt am Einschaltpunkt zu hängen.
            float on_frac  = id(wet_on).state;
            float off_frac = id(wet_off).state;
            // Vertauschte oder zu enge Eingabe abfangen: ohne Band gäbe es keine
            // Hysterese mehr und der Zustand flatterte im Rauschen (rund 2 % von
            // freq_dry, gemessen 184 Hz Standardabweichung über 10 Tage).
            if (off_frac < on_frac + ${wet_band_min}) {
              off_frac = on_frac + ${wet_band_min};
              ESP_LOGW("rain", "Schwelle Dry lag unter Wet + ${wet_band_min} - auf %.3f angehoben", off_frac);
            }
            float rain_start = id(freq_dry) * on_frac;
            float rain_stop  = id(freq_dry) * off_frac;

            if (f < rain_stop) {
              // Der Sensor ist im nassen Bereich (oder im Hysterese-Band).
              // Wir setzen unseren "Zuletzt Nass"-Timer immer wieder auf JETZT.
              last_wet_time = millis();
              
              // Wenn die Schwelle für echten Regen unterschritten wird -> SOFORT EIN!
              if (f < rain_start && !id(is_raining)) {
                id(is_raining) = true;
                id(rain_binary).publish_state(true);
              }
            } else {
              // Die Frequenz ist über rain_stop -> Sensor scheint aktuell trocken zu sein.
              // Wir schalten HA aber erst auf "Trocken", wenn das für X MINUTEN so bleibt!
              uint32_t dry_delay_ms = (uint32_t)(id(rain_off_delay_min).state * 60.0f * 1000.0f);
              
              if (id(is_raining) && (millis() - last_wet_time > dry_delay_ms)) {
                id(is_raining) = false;
                id(rain_binary).publish_state(false);
                id(time_since_dry) = millis(); // Wichtig: Für die Kalibrierung merken!
              }
            }

            // «Regen kürzlich»: geht an, sobald der Sensor nass ist, und fällt
            // erst, wenn seit der letzten Nässe die volle Haltezeit vergangen
            // ist. Gezählt wird ab der Nässe, nicht ab dem Abschalten von
            // rain_binary - die Haltezeit beschreibt also wirklich «zuletzt nass
            // vor X Minuten».
            bool recent = id(rain_recent_state);
            if (id(is_raining)) {
              recent = true;
            } else {
              uint32_t hold_ms = (uint32_t)(id(rain_hold_min).state * 60.0f * 1000.0f);
              if (recent && (millis() - last_wet_time > hold_ms)) recent = false;
            }
            if (recent != id(rain_recent_state)) {
              id(rain_recent_state) = recent;
              id(rain_recent).publish_state(recent);
            }

            // Nur auswertbar, wenn Soll- UND Istwert gültig sind - sonst ist
            // target_temp NaN und jeder Vergleich dagegen falsch.
            bool sensor_warm = heater_target_ok && heater_sensor_ok &&
                               current_temp >= (target_temp - 2.0);
            bool delay_passed = (millis() - id(time_since_dry)) > (id(cal_delay_min).state * 60 * 1000);
            float drift = fabsf(f - id(freq_dry)) / id(freq_dry);
            bool in_cal_range = (drift <= id(cal_range).state);

            // Den exakten Grund ermitteln. Die Grenze ist dieselbe wie oben in
            // der Nass-Erkennung (<, nicht <=), sonst melden Logik und Status
            // bei f == rain_stop Verschiedenes.
            if (id(is_raining)) {
              status_msg = "Regen aktiv";
            } else if (f < rain_stop) {
              status_msg = "Sensor noch zu nass";
            } else if (!ntc_plausible) {
              status_msg = "NTC unplausibel - Heizung aus";
            } else if (!heater_temp_ok) {
              status_msg = "Übertemperatur - Heizung aus";
            } else if (!heater_target_ok) {
              status_msg = "Sensordaten fehlen - Heizung aus";
            } else if (!sensor_warm) {
              status_msg = "Heizt auf";
            } else if (!delay_passed) {
              status_msg = "Wartet auf Delay";
            } else if (!in_cal_range) {
              status_msg = "Frequenz-Drift zu hoch";
            } else {
              status_msg = "Kalibriert";
              is_calibrating = true;
            }

            // Eigentliche Kalibrierung durchführen
            if (is_calibrating) {
              id(freq_dry) = (15.0 * id(freq_dry) + f) / 16.0;
            }
          }
          
          // Status senden - aber nur bei echter Änderung. Beide Werte ändern sich
          // wenige Male pro Tag; ein 10-s-Takt erzeugte bisher rund 8'600
          // identische Meldungen je Entität und Tag.
          static bool last_cal_active = false;
          static bool cal_active_valid = false;
          if (!cal_active_valid || is_calibrating != last_cal_active) {
            id(cal_active).publish_state(is_calibrating);
            last_cal_active = is_calibrating;
            cal_active_valid = true;
          }

          static std::string last_status_msg;
          if (status_msg != last_status_msg) {
            id(cal_status).publish_state(status_msg);
            last_status_msg = status_msg;
          }

          // --- 3. SHT31-WARTUNGSZYKLUS ---
          // Nicht waehrend Regen: der Taupunkt haengt an der Feuchte, und
          // waehrend des Zyklus haelt HA den letzten Wert. Bei Regen wird der
          // Sollwert der Sensorheizung also aus einem eingefrorenen Taupunkt
          // gebildet - das laesst sich vermeiden, indem der Zyklus wartet.
          static uint32_t last_sht_cycle = millis();
          float cycle_days = id(sht_cycle_days).state;
          if (cycle_days > 0 && !id(sht_heating_active) && !id(is_raining)) {
            uint32_t period_ms = (uint32_t)(cycle_days * 24.0f * 3600.0f * 1000.0f);
            if (millis() - last_sht_cycle > period_ms) {
              last_sht_cycle = millis();
              ESP_LOGI("sht", "Wartungszyklus gestartet (Intervall %.0f d)", cycle_days);
              id(sht_service_cycle).execute();
            }
          }

      # --- 4. ACTIVITY FLASH ---
      - script.execute: flash_activity

climate:
  # --------------------------------------------------------
  # DER NATIVE PID-REGLER (Läuft völlig autonom!)
  # --------------------------------------------------------
  - platform: pid
    name: "Rain Sensor Heater PID"
    id: rain_heater_pid
    sensor: heater_temp_fast
    default_target_temperature: 0.0
    heat_output: heater_pwm
    control_parameters:
      kp: 0.157   
      ki: 0.040   
      kd: 0.039

sensor:
  # --------------------------------------------------------
  # TEMPERATUR (AM2315 via am2320 Plattform)
  # --------------------------------------------------------
  - platform: am2320
    temperature:
      name: "Temperature Shed"
      state_class: measurement
      id: temp_shed

  # --------------------------------------------------------
  # LUFTFEUCHTIGKEIT (SHT31)
  # --------------------------------------------------------
  - platform: sht3xd
    # Die Temperatur des SHT31 wird nur beobachtet, nicht verwendet. Sie
    # beantwortet die Frage, ob die Taupunktrechnung Feuchte und Temperatur
    # zweier verschiedener Sensoren mischen darf: eine relative Feuchte gilt
    # nur bei der Temperatur, bei der sie gemessen wurde. Laut Sensirion
    # kostet 1 K Versatz bei hoher Feuchte bis zu 5 %RH.
    temperature:
      name: "Temperature SHT31"
      id: temp_sht
      state_class: measurement
      filters:
        - lambda: |-
            // Während des Wartungszyklus heizt sich der Chip selbst auf; der
            // Wert beschreibt dann den Heizer, nicht die Luft.
            if (id(sht_heating_active)) {
              return {};
            }
            return x;
    humidity:
      name: "Humidity Shed"
      id: hum_shed
      state_class: measurement
      filters:
        - lambda: |-
            // Waehrend des Wartungszyklus wird verworfen, HA haelt die alte
            // Linie. Bis V2.1.0 startete hier zusaetzlich ein Zyklus, sobald
            // die Feuchte 98 % ueberschritt. Diese Schwelle ist entfallen:
            // Der Heizer ist laut Datenblatt 4.10 fuer die
            // Plausibilitaetspruefung gedacht, laut Handling Instructions 3
            // gegen kontaminationsbedingte Drift - nicht gegen Kondensat. Das
            // Kriechen oberhalb 80 %RH (Datenblatt 1.1, bis +3 %RH nach 60 h)
            // bildet sich im Normalbereich von selbst zurueck. Der eine so
            // ausgeloeste Zyklus am 22.08.2026 hat denn auch nichts
            // korrigiert: Feuchte davor und nach voller Erholung gleich.
            if (id(sht_heating_active)) {
              return {};
            }
            return x;

  # --------------------------------------------------------
  # LUFTDRUCK (BMP280 mit Elevation Correction)
  # --------------------------------------------------------
  - platform: bmp280_i2c
    address: 0x76
    pressure:
      name: "Barometic Pressure Shed"
      id: bp_shed
      state_class: measurement
      filters:
        - lambda: 'return x + id(baro_corr).state;'

  # --------------------------------------------------------
  # TAUPUNKT (Kombiniert AM2315 Temp & SHT31 Hum)
  # --------------------------------------------------------
  - platform: template
    name: "Dew Point Shed"
    id: dewpoint_shed
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    lambda: |-
      // Magnus-Formel mit den Konstanten ueber Wasser aus Sensirions
      // «Introduction to Humidity» (m 17.62, Tn 243.12 °C, gueltig -45…60 °C
      // mit unter 0.6 % Unsicherheit). Zuvor standen hier 17.67 und 243.5;
      // der Unterschied betraegt am Betriebspunkt rund 0.01 K, die Konstanten
      // des Sensorherstellers sind aber die passende Referenz.
      float t  = id(temp_shed).state;
      float rh = id(hum_shed).state;
      if (std::isnan(t) || std::isnan(rh)) {
        return NAN;
      }
      // Klemmen wie in jedem Sensirion-Beispielcode: bei 0 % waere der
      // Logarithmus nicht definiert, ueber 100 % ergaebe sich ein Taupunkt
      // ueber der Lufttemperatur - und damit ein zu hoher Heizungssollwert.
      if (rh < 0.01f)   rh = 0.01f;
      if (rh > 100.0f)  rh = 100.0f;
      const float m  = 17.62f;
      const float tn = 243.12f;
      float h = logf(rh / 100.0f) + (m * t) / (tn + t);
      return (tn * h) / (m - h);

  # --------------------------------------------------------
  # REGENSENSOR FREQUENZEN (Pin 32)
  # --------------------------------------------------------
  - platform: pulse_counter
    pin: GPIO32
    id: rain_freq
    internal: true
    update_interval: 1s
    internal_filter: 2us
    filters:
      - multiply: 0.016666667  # Rechnet Pulses/min in Hz um
      - exponential_moving_average:
          alpha: 0.166  
          send_every: 1

  - platform: template
    name: "Weather Station Frequency"
    unit_of_measurement: "Hz"
    device_class: frequency
    state_class: measurement
    accuracy_decimals: 0
    update_interval: 1s
    lambda: 'return id(rain_freq).state;'
    filters:
      # 60s statt 10s: Die Regenentscheidung fällt auf dem Gerät (10-s-Schleife),
      # in HA dient der Wert nur der Beobachtung. Gemittelt wird weiterhin über
      # jede Sekunde, es geht also keine Information verloren.
      - throttle_average: 60s

  - platform: template
    name: "1.0 Weather Station Dry Frequency"
    unit_of_measurement: "Hz"
    device_class: frequency
    state_class: measurement
    accuracy_decimals: 0
    # 5 min: Der Wert wandert nur beim Kalibrieren und dann mit 1/16-Gewichtung,
    # bewegt sich also über Stunden nur um wenige Hertz.
    update_interval: 300s
    entity_category: diagnostic
    lambda: 'return id(freq_dry);'

  # Die Nummer 1.6 ist absichtlich frei: dort lag bis V2.2.1 die Steigung der
  # Flankenerkennung. Nachrücken würde die Entity-ID und damit den Verlauf
  # dieser Reihe kosten.
  #
  # Die Messgrösse der Beobachtung: solange diese Differenz klein bleibt, ist
  # die gemischte Taupunktrechnung unbedenklich. Der Fehler im Taupunkt liegt
  # bei rund dem 0.9-fachen dieses Werts und geht über den Sollwert direkt in
  # die Heizungsregelung.
  - platform: template
    name: "1.7 Temperature Delta SHT31 - AM2315"
    unit_of_measurement: "K"
    state_class: measurement
    accuracy_decimals: 2
    update_interval: 60s
    entity_category: diagnostic
    lambda: |-
      if (std::isnan(id(temp_sht).state) || std::isnan(id(temp_shed).state)) {
        return NAN;
      }
      return id(temp_sht).state - id(temp_shed).state;

  # --------------------------------------------------------
  # HEIZUNG TEMPERATUR (NTC Pin 36) - 3-Stufen-Umrechnung
  # --------------------------------------------------------
  # Stufe 1: Reine Spannungsmessung am Pin
  - platform: adc
    id: adc_sensor_ntc
    pin: GPIO36
    attenuation: 12db
    update_interval: 100ms
    internal: true

  # Stufe 2: Spannungsteiler-Berechnung mit 680 Ohm Vorwiderstand
  - platform: resistance
    id: resistance_sensor
    sensor: adc_sensor_ntc
    configuration: DOWNSTREAM # NTC ist gegen GND geschaltet (Standard). Falls die Temp sinkt wenn du ihn wärmst, ändere das auf UPSTREAM.
    resistor: 680ohm
    internal: true

  # Stufe 3: Temperatur-Berechnung aus dem Widerstandswert
  - platform: ntc
    sensor: resistance_sensor
    id: heater_temp_fast
    internal: true
    calibration:
      b_constant: 3750          
      reference_temperature: 25°C
      reference_resistance: 1000ohm
    filters:
      # Der ADC tastet weiterhin mit 10 Hz ab (gute Rauschunterdrückung), der
      # Sensor publiziert aber nur alle 2 s einen 2-s-Mittelwert. Da der PID-Regler
      # an genau diesem Callback hängt, bestimmt 'send_every' zugleich seine
      # Rechen- UND Publiziererate: vorher 10 Hz, jetzt 0.5 Hz. Für die träge
      # Thermik der Sensorheizung (~0.1 K/s beim Aufheizen) ist das reichlich.
      - sliding_window_moving_average:
          window_size: 20
          send_every: 20

  # Stufe 4: Schaufenster für Home Assistant (Sammelt die Werte und sendet alle 60s)
  - platform: template
    name: "Weather Station Sensor Heater"
    id: heater_temp
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    update_interval: 2s
    lambda: 'return id(heater_temp_fast).state;'
    filters:
      - throttle_average: 60s

binary_sensor:
  # --------------------------------------------------------
  # REGEN-STATUS
  # --------------------------------------------------------
  # Kein lambda: Der Wert wird direkt aus der 10-s-Logik publiziert, sobald die
  # Flanke kippt. Das senkt nicht nur die Meldungsrate (vorher 60-s-Takt, immer
  # derselbe Wert), sondern verkuerzt auch die Reaktionszeit in HA von bis zu
  # 60 s auf maximal 10 s.
  - platform: template
    name: "Regen Shed"
    id: rain_binary
    device_class: moisture

  # Zweite Semantik neben dem schnellen Nass-Signal: «Regen Shed» sagt, ob der
  # Sensor JETZT nass ist, «Regen kürzlich» ob es in den letzten
  # «Rain Hold Time» Minuten geregnet hat. Für Automatisierungen, die ein
  # Regenereignis als Ganzes brauchen (Storen, Fenster, Bewässerung) und nicht
  # bei jeder Trocknungspause zwischen zwei Schauern umschalten sollen.
  - platform: template
    name: "Regen kürzlich"
    id: rain_recent
    device_class: moisture

  # --------------------------------------------------------
  # DIAGNOSTIC SENSOR FÜR DIE KALIBRIERUNG
  # -------------------------------------------------------- 
  - platform: template
    name: "1.2 Dry Frequency Calibration Active"
    id: cal_active
    entity_category: diagnostic
    device_class: running

  # --------------------------------------------------------
  # DIAGNOSTIC SENSOR FÜR DEN SHT-WARTUNGSZYKLUS
  # --------------------------------------------------------
  - platform: template
    name: "1.4 SHT Wartungszyklus aktiv"
    id: sht_service_active
    entity_category: diagnostic
    device_class: running
    # Kein lambda: Der Zustand kippt genau zweimal pro Wartungszyklus und wird
    # direkt im Skript publiziert - ein 60-s-Polling waere reine Wiederholung.

  # --------------------------------------------------------
  # DIAGNOSTIC SENSOR FÜR DIE HEIZUNGS-STÖRUNG
  # --------------------------------------------------------
  - platform: template
    name: "1.5 Heizung Störung"
    id: heater_fault
    entity_category: diagnostic
    device_class: problem
    # Kein lambda: Der Zustand wird direkt aus der 10-s-Logik publiziert, sobald
    # der NTC-Wert das Plausibilitätsfenster verlässt. EIN heisst: Fühler defekt,
    # Heizung zwangsweise aus.

text_sensor:
  # --------------------------------------------------------
  # DIAGNOSTIC SENSOR FÜR DIE KALIBRIERUNG STATUS
  # --------------------------------------------------------
  - platform: template
    name: "1.1 Dry Frequency Calibration Status"
    id: cal_status
    entity_category: diagnostic
    icon: mdi:information-outline

  # --------------------------------------------------------
  # DIAGNOSTIC SENSOR FÜR DEN SHT-WARTUNGSSTATUS
  # -------------------------------------------------------- 
  - platform: template
    name: "1.3 SHT Wartungsstatus"
    id: sht_service_status
    entity_category: diagnostic
    icon: mdi:water-thermometer

# --------------------------------------------------------
# PWM AUSGANG FÜR HEIZUNG (Pin 27)
# --------------------------------------------------------
output:
  - platform: ledc
    pin: GPIO27
    inverted: true
    id: heater_pwm
    frequency: 2000Hz

  # RGB LED
  - platform: gpio
    pin:
      number: GPIO16
      inverted: true
    id: led_red

  - platform: gpio
    pin:
      number: GPIO17
      inverted: true
    id: led_green

  - platform: gpio
    pin:
      number: GPIO18
      inverted: true
    id: led_blue

  # Activity LED
  - platform: gpio
    pin:
      number: GPIO15
      inverted: true
    id: led_activity
